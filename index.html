    document.getElementById("editor").innerHTML = `
      <div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg)">
        <label for="q">Prompt</label>
        <textarea id="q" placeholder="e.g. Which term dominates the variance here?">${esc(q ? q.question : "")}</textarea>
        <div style="height:14px"></div>
        <label>Answer options</label>
        <div id="opts"></div>
        <div style="height:6px"></div>
        <label class="check"><input type="checkbox" id="slideonly" ${q && !standalone(q) ? "checked" : ""}>
          <span>Only show this inside a slide <span class="muted">— skipped when you step through questions</span></span></label>
        <div class="row" style="margin-top:10px">
          <button class="ghost small" id="addopt">+ Add option</button>
          <button class="primary small" id="save">Save</button>
          <button class="ghost small" id="cancel">Cancel</button>
          <span class="muted" id="savemsg"></span>
        </div>
      </div>`;
    drawOpts(opts);
    document.getElementById("addopt").onclick = () => {
      const v = readOpts(); if (v.length < 8) drawOpts([...v, ""]);
    };
    document.getElementById("cancel").onclick = () => closeEditor();
    document.getElementById("save").onclick = saveQuestion;
    document.getElementById("q").focus();
  }
  function closeEditor(){ editing = null; document.getElementById("editor").innerHTML = ""; }

  function drawOpts(values){
    const el = document.getElementById("opts");
    el.innerHTML = values.map((v, i) => `
      <div class="opt-row">
        <span class="tag">${LETTERS[i]}</span>
        <input type="text" value="${esc(v)}" placeholder="Option ${LETTERS[i]}">
        <button class="ghost" data-del="${i}" title="Remove">&times;</button>
      </div>`).join("");
    el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const vals = readOpts(); vals.splice(+b.dataset.del, 1);
      drawOpts(vals.length ? vals : [""]);
    });
  }
  const readOpts = () =>
    [...document.querySelectorAll("#opts input")].map(i => i.value);

  async function saveQuestion(){
    const options = readOpts().map(s => s.trim()).filter(Boolean);
    const question = document.getElementById("q").value.trim();
    const isStandalone = !document.getElementById("slideonly").checked;
    if (!question)          return msg("Needs a prompt.");
    if (options.length < 2) return msg("Needs at least two options.");
    if (!editing.id) {
      await setDoc(qRef(room, newQid()), { question, options, order: Date.now(), standalone: isStandalone });
    } else {
      await updateDoc(qRef(room, editing.id), { question, options, standalone: isStandalone });
    }
    closeEditor();
  }

  function openSlideEditor(sid){
    const s = sid && slides.find(x => x.id === sid);
    const picked = new Set(s ? s.qids || [] : []);
    const num = numbering();
    document.getElementById("editor").innerHTML = `
      <div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg)">
        <label for="st">Slide title (optional)</label>
        <input type="text" id="st" value="${esc(s ? s.title : "")}" placeholder="e.g. Revisit: has anything changed?">
        <div style="height:14px"></div>
        <label>Questions on this slide</label>
        ${questions.length ? `<div id="picks">${questions.map(q => `
          <label class="check"><input type="checkbox" value="${esc(q.id)}" ${picked.has(q.id) ? "checked" : ""}>
            <span>${num[q.id] ? `<b>${num[q.id]}.</b> ` : ""}${esc(q.question)}${
              standalone(q) ? "" : ` <span class="muted">· slide only</span>`}</span></label>`).join("")}</div>`
          : `<p class="muted" style="margin:0 0 8px">No questions yet — add some first.</p>`}
        <p class="muted" style="margin:6px 0 0">Tick earlier questions to bring them back for a revisit.
          For questions that belong only on this slide, add them with <b>+ Add question</b> and tick
          <i>Only show this inside a slide</i>.</p>
        <div class="row" style="margin-top:10px">
          <button class="primary small" id="save">Save</button>
          <button class="ghost small" id="cancel">Cancel</button>
          <span class="muted" id="savemsg"></span>
        </div>
      </div>`;
    document.getElementById("cancel").onclick = () => closeEditor();
    document.getElementById("save").onclick = saveSlide;
    document.getElementById("st").focus();
  }

  async function saveSlide(){
    const title = document.getElementById("st").value.trim();
    const ticked = new Set([...document.querySelectorAll("#picks input:checked")].map(i => i.value));
    const qids = questions.map(q => q.id).filter(id => ticked.has(id));
    if (!qids.length)                return msg("Tick at least one question.");
    if (qids.length > MAX_PER_SLIDE) return msg(`At most ${MAX_PER_SLIDE} questions per slide.`);
    try {
      if (!editing.id) await setDoc(sRef(room, newSid()), { title, qids, order: Date.now() });
      else             await updateDoc(sRef(room, editing.id), { title, qids });
    } catch {
      return msg("Couldn't save — publish the updated firestore.rules in Firebase.");
    }
    closeEditor();
  }

  function msg(t){
    const m = document.getElementById("savemsg");
    if (m) { m.textContent = t; setTimeout(() => { if (m) m.textContent = ""; }, 3200); }
  }

  document.getElementById("addq").onclick = () => openEditor("q", null);
  document.getElementById("adds").onclick = () => openEditor("s", null);
  document.getElementById("addimport").onclick = openImport;

  function openImport(){
    editing = { kind: "import", id: null };
    document.getElementById("editor").innerHTML = `
      <div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg)">
        <label for="deck">Paste a set of polls</label>
        <textarea id="deck" spellcheck="false" style="min-height:260px;font:.88rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace"
          placeholder="# First impressions&#10;Q: How convinced are you by the main claim?&#10;- Very&#10;- Somewhat&#10;- Not at all&#10;&#10;---&#10;Q: A question on its own&#10;- Yes&#10;- No"></textarea>
        <p class="muted" style="margin:8px 0 0"><code class="inline"># Title</code> starts a slide ·
          <code class="inline">---</code> ends it · <code class="inline">Q:</code> a question ·
          <code class="inline">- </code> an option · a <code class="inline">Q:</code> with no options on a slide
          brings back the earlier question with the same wording · <code class="inline">D:</code> a discussion prompt ·
          <code class="inline">IMG:</code> a picture · <code class="inline">SNP:</code> the one-SNP regression demo
          (<code class="inline">EQTL:</code> the same for a gene's expression) · <code class="inline">SCAN:</code> the class eQTL scan ·
          <code class="inline">COLOC:</code> the colocalization demo ·
          <code class="inline">//</code> notes are ignored.</p>
        <label class="check" style="margin-top:8px"><input type="checkbox" id="atstart">
          <span>Add at the start of the lecture <span class="muted">— otherwise everything goes after your current questions</span></span></label>
        <div class="row" style="margin-top:10px">
          <button class="primary small" id="save" disabled>Import</button>
          <button class="ghost small" id="cancel">Cancel</button>
          <span class="muted" id="savemsg"></span>
        </div>
        <div id="deckcheck" class="muted" style="margin-top:8px"></div>
      </div>`;
    const ta = document.getElementById("deck"), btn = document.getElementById("save");
    let parsed = null;
    ta.oninput = () => {
      parsed = parseDeck(ta.value, questions);
      const box = document.getElementById("deckcheck");
      const empty = !parsed.items.length;
      btn.disabled = empty || parsed.errors.length > 0;
      box.innerHTML = empty ? "" : parsed.errors.length
        ? `<div class="warn" style="margin:0">${parsed.errors.slice(0, 8).map(esc).join("<br>")}${parsed.errors.length > 8 ? "<br>…" : ""}</div>`
        : `Ready: ${parsed.newCount} new question${parsed.newCount === 1 ? "" : "s"}, ${parsed.slideCount} slide${parsed.slideCount === 1 ? "" : "s"}` +
          (parsed.revisits ? `, ${parsed.revisits} brought back for a revisit` : "") +
          (parsed.discussions ? `, ${parsed.discussions} discussion prompt${parsed.discussions === 1 ? "" : "s"}` : "") +
          (parsed.images ? `, ${parsed.images} image${parsed.images === 1 ? "" : "s"}` : "") +
          (parsed.snps ? `, ${parsed.snps} one-SNP demo${parsed.snps === 1 ? "" : "s"}` : "") +
          (parsed.eqtls ? `, ${parsed.eqtls} eQTL demo${parsed.eqtls === 1 ? "" : "s"}` : "") +
          (parsed.scans ? `, ${parsed.scans} class eQTL scan${parsed.scans === 1 ? "" : "s"}` : "") +
          (parsed.colocs ? `, ${parsed.colocs} colocalization demo${parsed.colocs === 1 ? "" : "s"}` : "") + ".";
    };
    document.getElementById("cancel").onclick = () => closeEditor();
    btn.onclick = async () => {
      if (!parsed || parsed.errors.length) return;
      btn.disabled = true;
      try { await importDeck(parsed, document.getElementById("atstart").checked); closeEditor(); }
      catch { btn.disabled = false; msg("Couldn't import. Check the connection, and that the latest firestore.rules are published."); }
    };
    ta.focus();
  }

  // Everything lands after the current questions (or before them all), in the order it was written.
  async function importDeck(parsed, atStart = false){
    let order = 0;
    const ids = new Map(), writes = [];
    let n = 0;
    const idFor = q => {
      const target = q.reuse || q;
      if (target.id) return target.id;                       // an existing question
      if (!ids.has(target)) ids.set(target, newQid() + (n++).toString(36));
      return ids.get(target);
    };
    const addQ = (q, standalone) => {
      if (q.reuse) return;
      writes.push([qRef(room, idFor(q)), { question: q.question, options: q.options, order: order++, standalone }]);
    };
    for (const it of parsed.items) {
      if (it.kind === "q") { addQ(it.q, true); continue; }
      if (it.kind === "d") {
        writes.push([sRef(room, newSid() + (n++).toString(36)), { title: it.title, qids: [], order: order++, step: "discuss", points: it.points }]);
        continue;
      }
      if (it.kind === "snp" || it.kind === "eqtl") {
        writes.push([sRef(room, newSid() + (n++).toString(36)), { title: it.title || SNP_KINDS[it.kind].title, qids: [], order: order++, step: it.kind }]);
        continue;
      }
      if (it.kind === "coloc") {
        writes.push([sRef(room, newSid() + (n++).toString(36)), { title: it.title || COLOC_TITLE, qids: [], order: order++, step: "coloc" }]);
        continue;
      }
      if (it.kind === "scan") {
        // The vote ("eQTL or not?") is an ordinary question that lives on the step.
        const qid = newQid() + (n++).toString(36);
        writes.push([qRef(room, qid), { question: SCAN_Q, options: SCAN_OPTS, order: order++, standalone: false }]);
        writes.push([sRef(room, newSid() + (n++).toString(36)), { title: it.title || SCAN_TITLE, qids: [qid], order: order++, step: "scan" }]);
        continue;
      }
      if (it.kind === "i") {
        writes.push([sRef(room, newSid() + (n++).toString(36)), { title: it.title || "Image", qids: [], order: order++, step: "image", src: it.src }]);
        continue;
      }
      it.qs.forEach(q => addQ(q, false));
      writes.push([sRef(room, newSid() + (n++).toString(36)), { title: it.title, qids: it.qs.map(idFor), order: order++ }]);
    }
    const orders = [...questions.map(q => q.order || 0), ...slides.map(x => x.order || 0)];
    const base = atStart && orders.length ? Math.min(...orders) - order - 1
                                          : Math.max(Date.now(), ...orders) + 1;
    writes.forEach(([, data]) => (data.order += base));
    for (let i = 0; i < writes.length; i += 400) {
      const batch = writeBatch(db);
      writes.slice(i, i + 400).forEach(([ref, data]) => batch.set(ref, data));
      await batch.commit();
    }
  }

  /* ---- actions on an item ---- */
  // A slide whose questions were all asked earlier in the lecture is the second
  // time around.
  function isRevisit(list, i){
    const ids = list[i] && list[i].kind === "s" ? showFor(list[i]) : [];
    return ids.length > 0 && ids.every(qid => list.slice(0, i).some(prev => showFor(prev).includes(qid)));
  }
  // Start a fresh round on a question: keep this round's tally as `earlier`
  // (the "before"), then clear the votes so everyone answers again.
  async function newRound(qid){
    const vs = await getDocs(votesRef(room, qid));
    const { counts, total } = tally(qById(qid), vs.docs.map(d => d.data()));
    await updateDoc(qRef(room, qid), { earlier: { counts, total, at: Date.now() } });
    const batch = writeBatch(db);
    vs.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  async function showItem(id){
    if (plotOn) document.getElementById("prsplot").click();
    const stepIt = items().find(x => x.id === id), step = stepOf(stepIt);
    if (step === "snp" || step === "eqtl" || step === "coloc") {
      // On screen only (the knob is yours); phones say to look at the screen.
      await updateDoc(roomRef(room), { current: id, show: [], title: stepIt.s.title || (step === "coloc" ? COLOC_TITLE : SNP_KINDS[step].title),
                                       open: false, reveal: false, activity: "screen" });
      return;
    }
    if (step === "scan") {
      // Each phone shows its own gene and votes on the step's question; which genes are real stays hidden.
      await updateDoc(roomRef(room), { current: id, show: slideQids(stepIt.s), title: titleFor(stepIt),
                                       open: true, reveal: false, truth: false, activity: "scan" });
      return;
    }
    if (step === "image") {
      // The picture goes on the room so phones can show it too.
      await updateDoc(roomRef(room), { current: id, show: [], title: stepIt.s.title || "", src: stepIt.s.src || "",
                                       open: false, reveal: false, activity: "image" });
      return;
    }
    if (step === "discuss") {
      // The prompt and its sub-questions go on the room so phones can show them too.
      await updateDoc(roomRef(room), { current: id, show: [], title: stepIt.s.title || "", points: stepIt.s.points || [],
                                       open: false, reveal: false, activity: "discuss" });
      return;
    }
    if (step) {
      // Phones show each student's celebrity for both steps; the plot itself is only on screen.
      await updateDoc(roomRef(room), { current: id, show: [], title: STEP_NAME[step], open: false, reveal: false, activity: "prs" });
      return;
    }
    const list = items(), i = list.findIndex(x => x.id === id), it = list[i];
    if (!it) return;
    const ids = showFor(it);
    // The first time a revisit slide comes up, its second round starts by itself.
    // Questions that already have a second round (you came back to the slide) keep it.
    if (isRevisit(list, i))
      for (const qid of ids) if (!qById(qid).earlier) await newRound(qid);
    await updateDoc(roomRef(room), { current: it.id, show: ids, title: titleFor(it), open: true, reveal: false, activity: null });
  }
  async function wipeVotes(qid){
    const vs = await getDocs(votesRef(room, qid));
    const batch = writeBatch(db);
    vs.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }

  window.__show = showItem;
  window.__edit = qid => openEditor("q", qid);
  window.__editSlide = sid => openEditor("s", sid);
  window.__del  = async qid => {
    if (!confirm("Delete this question and its votes?")) return;
    await wipeVotes(qid);
    await deleteDoc(qRef(room, qid));
    for (const s of slides)
      if ((s.qids || []).includes(qid))
        await updateDoc(sRef(room, s.id), { qids: s.qids.filter(x => x !== qid) });
    if (roomData.current === qid) await hideAll();
  };
  window.__delSlide = async sid => {
    if (!confirm("Delete this slide? Its questions and their votes are kept.")) return;
    const s = slides.find(x => x.id === sid);
    await deleteDoc(sRef(room, sid));
    // The class eQTL scan's question belongs to it alone, so it goes too.
    if (s && s.step === "scan") {
      for (const qid of s.qids || []) { await wipeVotes(qid); await deleteDoc(qRef(room, qid)); }
      if (roomData.current === sid) await hideAll();
      return;
    }
    // A slide-only question that was on no other slide goes back to the main
    // list, so nothing ends up unreachable.
    for (const qid of (s && s.qids) || []) {
      const q = qById(qid);
      if (q && !standalone(q) && !slides.some(x => x.id !== sid && (x.qids || []).includes(qid)))
        await updateDoc(qRef(room, qid), { standalone: true });
    }
    if (roomData.current === sid) await hideAll();
  };
  window.__move = async (id, delta) => {
    const list = items();
    const i = list.findIndex(x => x.id === id), j = i + delta;
    if (i < 0 || j < 0 || j >= list.length) return;
    const a = list[i], b = list[j];
    const ref = it => it.kind === "q" ? qRef(room, it.id) : sRef(room, it.id);
    const batch = writeBatch(db);
    batch.update(ref(a), { order: a.order === b.order ? b.order + delta : b.order });
    batch.update(ref(b), { order: a.order });
    await batch.commit();
  };

  // Results stay hidden while anyone can still vote. Closing the second round
  // (questions that have been re-polled) reveals before and after together;
  // closing a first round keeps it hidden, so it can't sway the re-test.
  async function toggleOpen(){
    if (!roomData.current) return;
    const closing = !!roomData.open, ids = liveIds();
    const patch = { open: !closing };
    if (!closing) patch.reveal = false;
    else if (ids.length && ids.every(id => qById(id).earlier)) patch.reveal = true;
    await updateDoc(roomRef(room), patch);
  }
  async function toggleReveal(){
    if (!roomData.current) return;
    await updateDoc(roomRef(room), { reveal: !roomData.reveal });
  }
  // Space moves a poll along, one press at a time: close voting → reveal the results →
  // open voting again (results hide). Closing a re-polled round reveals straight away.
  // Activity steps have no voting, so Space leaves them alone; the class eQTL scan has a vote.
  async function spaceKey(){
    const st = roomData.current && stepOf(items().find(x => x.id === roomData.current));
    if (!roomData.current || (st && st !== "scan")) return;
    if (roomData.open) return toggleOpen();
    if (!roomData.reveal) return toggleReveal();
    return toggleOpen();
  }
  async function clearVotes(){
    const ids = liveIds();
    if (!ids.length) return;
    if (!confirm(ids.length > 1 ? `Clear the votes on all ${ids.length} questions showing?`
                                : "Clear the votes on this question?")) return;
    for (const id of ids) {
      await wipeVotes(id);
      if (qById(id) && qById(id).earlier) await updateDoc(qRef(room, id), { earlier: deleteField() });
    }
    if (roomData.reveal) await updateDoc(roomRef(room), { reveal: false });
  }
  // Re-poll: keep the current result as "before", then let the class vote again.
  async function repoll(){
    const ids = liveIds();
    if (!ids.length) return;
    if (!confirm(`Save the current result${ids.length > 1 ? "s" : ""} for comparison, clear the votes, and reopen voting?`)) return;
    for (const id of ids) await newRound(id);
    await updateDoc(roomRef(room), { open: true, reveal: false });
  }
  async function step(delta){
    const list = items();
    const i = list.findIndex(x => x.id === roomData.current);
    const next = list[(i < 0 ? 0 : i + delta)];
    if (next) await showItem(next.id);
  }
  async function hideAll(){
    await updateDoc(roomRef(room), { current: null, show: [], title: null, open: false, reveal: false, activity: null });
  }

  /* ---- student questions ---- */
  document.getElementById("qatoggle").onclick = () =>
    updateDoc(roomRef(room), { qa: !roomData.qa });
  document.getElementById("qaticker").onclick = () =>
    updateDoc(roomRef(room), { ticker: !tickerOn() });

  // Open student questions scroll across the projector unless you switch it off.
  const tickerOn = () => roomData.ticker !== false;

  // The ticker band lives outside #app so it can pin to the bottom of the screen.
  const band = document.createElement("div");
  band.className = "ticker";
  band.innerHTML = `<span class="ticker-label">From the class</span>
    <div class="ticker-view"><div class="ticker-track"></div></div>`;
  document.body.appendChild(band);
  // Each finished pass is saved on the question, so leaving Present mode and
  // coming back doesn't start the count over.
  const tick = makeTicker(band.querySelector(".ticker-view"), band.querySelector(".ticker-track"), id => {
    const a = asks.find(x => x.id === id);
    if (a) updateDoc(askRef(room, id), { shown: (a.shown || 0) + 1 }).catch(() => {});
  });
  // Open questions stream across in Present mode, apart from one already up on its
  // own, until they've crossed the screen PASSES times.
  function syncTicker(){
    const items = asks.filter(a => a.status !== "answered" && a.id !== roomData.spot && (a.shown || 0) < PASSES);
    tick.set(items);
    const on = tickerOn() && items.length > 0;
    document.body.classList.toggle("ticking", on);
    tick.run(on && document.body.classList.contains("present"));
    fitPresent();     // the ticker and the corner badge take room from the slide
  }
  document.addEventListener("presentchange", () => { syncTicker(); fitPresent(); });
  addEventListener("resize", () => fitPresent());

  // On the projector a slide must fit on one screen: the join badge, the buttons
  // in the corner and the ticker are pinned over the bottom of the page, so a slide
  // that runs under them gets covered. Shrink the results (CSS zoom, so text
  // re-wraps) to the largest size that ends above all of those, but no smaller than half.
  function fitPresent(){
    const box = document.getElementById("results");
    box.style.zoom = "";
    if (!document.body.classList.contains("present") || !box.offsetHeight) return;
    const pinned = [...document.querySelectorAll("#joinbadge, #qabadge, .exit-present, .ticker")]
      .map(el => el.getBoundingClientRect()).filter(r => r.height > 0);
    const floor = Math.min(innerHeight, ...pinned.map(r => r.top)) - 12;
    const fits = z => { box.style.zoom = z; return box.getBoundingClientRect().bottom <= floor; };
    if (fits(1)) return;
    // Text re-wraps as it shrinks, so search for the largest size that fits.
    let lo = 0.5, hi = 1;
    for (let i = 0; i < 7; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    box.style.zoom = lo;
  }
  document.getElementById("qaclear").onclick = async () => {
    if (!asks.length || !confirm(`Delete all ${asks.length} student question${asks.length === 1 ? "" : "s"}?`)) return;
    for (let i = 0; i < asks.length; i += 400) {
      const batch = writeBatch(db);
      asks.slice(i, i + 400).forEach(a => batch.delete(askRef(room, a.id)));
      await batch.commit();
    }
    if (roomData.spot) await updateDoc(roomRef(room), { spot: null });
  };
  document.getElementById("qabadge").onclick = () => {
    setPresent(false);
    document.getElementById("qa").scrollIntoView({ block: "start" });
  };
  window.__spot = aid =>
    updateDoc(roomRef(room), { spot: roomData.spot === aid ? null : aid });
  window.__answered = async aid => {
    const a = asks.find(x => x.id === aid);
    if (!a) return;
    await updateDoc(askRef(room, aid), { status: a.status === "answered" ? null : "answered" });
    if (roomData.spot === aid) await updateDoc(roomRef(room), { spot: null });
  };
  window.__rescroll = aid => updateDoc(askRef(room, aid), { shown: 0 });
  window.__delAsk = async aid => {
    if (!confirm("Delete this student question?")) return;
    await deleteDoc(askRef(room, aid));
    if (roomData.spot === aid) await updateDoc(roomRef(room), { spot: null });
  };

  /* ---- activity: height polygenic score ---- */
  // Each student taps their name on their phone and sees one celebrity's genotypes.
  // The class list and who-has-whom live on the room doc (room.roster), so they stay
  // in Firebase and never in the public site's files.
  const roster = () => Array.isArray(roomData.roster) ? roomData.roster : [];
  let prsEditing = false, prsSig = null;
  function dealCelebs(names){
    // With fewer students than celebrities, leave out the ones whose absence keeps the
    // score's R² for height closest to the full set's, so the prediction plot tells the same
    // story for any class size. Then a fresh random order; past the last one it starts over.
    let order = PRS.people.map((_, i) => i);
    const heights = order.every(c => Number.isFinite(PRS.people[c].height));
    const r2 = ids => {
      const x = ids.map(prsScore), y = ids.map(c => PRS.people[c].height), n = ids.length;
      const mx = x.reduce((s, v) => s + v, 0) / n, my = y.reduce((s, v) => s + v, 0) / n;
      let sxy = 0, sxx = 0, syy = 0;
      for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; }
      return sxx && syy ? sxy * sxy / (sxx * syy) : 0;
    };
    if (heights && names.length >= 3 && names.length < order.length) {
      const target = r2(order);
      while (order.length > names.length) {
        let drop = 0, gap = Infinity;
        order.forEach((_, k) => { const g = Math.abs(r2(order.filter((_, j) => j !== k)) - target); if (g < gap) { gap = g; drop = k; } });
        order.splice(drop, 1);
      }
    }
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    return names.map((n, i) => ({ n, c: order[i % order.length] }));
  }
  document.getElementById("prsgo").onclick = () =>
    updateDoc(roomRef(room), { activity: roomData.activity === "prs" ? null : "prs" });

  // Two steps at the end of the lecture; move them where they belong with the arrows.
  document.getElementById("prsadd").onclick = async () => {
    const at = Math.max(Date.now(), ...questions.map(q => q.order || 0), ...slides.map(x => x.order || 0)) + 1;
    const batch = writeBatch(db);
    batch.set(sRef(room, newSid() + "a"), { title: STEP_NAME.prs, qids: [], order: at, step: "prs" });
    batch.set(sRef(room, newSid() + "b"), { title: STEP_NAME.plot, qids: [], order: at + 1, step: "plot" });
    await batch.commit();
    document.getElementById("qlist").scrollIntoView && document.getElementById("qlist").scrollIntoView({ block: "end" });
  };

  // The prediction plot is for the projector only, and the knob is yours: it isn't
  // stored or sent to phones.
  let plotOn = false;
  document.getElementById("prsplot").onclick = () => {
    plotOn = !plotOn;
    document.getElementById("prsplot").textContent = plotOn ? "Hide prediction plot" : "Show prediction plot";
    shape = null; drawResults();
    const box = document.getElementById("results");
    if (plotOn && box.scrollIntoView) box.scrollIntoView({ block: "start" });
  };
  function drawPlot(box){
    const list = roster();
    const ids = list.length ? [...new Set(list.map(r => r.c))] : PRS.people.map((_, i) => i);
    const s = JSON.stringify(["plot", ids]);
    if (s === shape) return;
    shape = s;
    app.classList.add("wide");
    const m = plotModel(ids), { html, geom } = plotHTML(m);
    cancelAnimationFrame(box.__plotRaf || 0);
    box.__plotNow = null;                   // a fresh plot starts from its own first layout
    box.innerHTML = html;
    // r2: how good the score is (null: the class's own scores). n: the GWAS size, when
    // that's the knob that was turned; R² then follows from it.
    let r2 = null, n = null;
    const paint = () => plotPaint(box, m, geom, r2, n);
    const slider = box.querySelector("#r2"), nslider = box.querySelector("#gwasn");
    slider.oninput = () => { r2 = +slider.value; n = null; paint(); };
    const setN = v => { n = v; r2 = gwasR2(n); paint(); };
    nslider.oninput = () => setN(10 ** +nslider.value);
    // Let go of a slider once it's set, so ← → go back to stepping through the lecture;
    // ↑ ↓ nudge R² instead, and shift ↑ ↓ the GWAS size.
    slider.onchange = () => slider.blur();
    nslider.onchange = () => nslider.blur();
    box.__nudge = step => {
      r2 = Math.round(Math.min(1, Math.max(0, (r2 === null ? m.r * m.r : r2) + step)) * 100) / 100;
      n = null;
      paint();
    };
    box.__nudgeN = dir => {
      const cur = n !== null ? n : r2 === null ? 10 ** +nslider.value : gwasN(r2);
      const lg = !(cur > 0) ? GWAS_LO : Number.isFinite(cur) ? Math.log10(cur) : GWAS_HI + 0.25;
      setN(10 ** Math.min(GWAS_HI, Math.max(GWAS_LO, Math.round((lg + dir * 0.25) * 4) / 4)));
    };
    box.querySelectorAll(".plot-presets [data-r2]").forEach(b => b.onclick = () => {
      r2 = b.dataset.r2 === "real" ? null : +b.dataset.r2;
      n = null;
      paint();
    });
    box.querySelectorAll(".plot-presets [data-n]").forEach(b => b.onclick = () => setN(+b.dataset.n));
    box.querySelector("#plotnames").onclick = e => {
      const plot = box.querySelector("#plot");
      plot.classList.toggle("nonames");
      e.target.textContent = plot.classList.contains("nonames") ? "Show names" : "Hide names";
      paint();
    };
    paint();
    fitPresent();
  }

  // The one-SNP demo (height or expression). The knobs are yours, on screen only: drag them,
  // click a preset, or press ↑ ↓ to step the effect through round values and shift ↑ ↓ the
  // allele frequency.
  function drawSnp(box, cur, K){
    const sg = JSON.stringify([K.key, cur.id, cur.s.title]);
    if (sg === shape) return;
    shape = sg;
    app.classList.add("wide");
    const { html, geom } = snpHTML(cur.s.title, K);
    cancelAnimationFrame(box.__snpRaf || 0);
    box.innerHTML = html;
    let beta = K.b0, p = K.p0;
    const slider = box.querySelector("#beta"), paint = () => snpPaint(box, geom, beta, p, K);
    const maf = box.querySelector("#maf");
    const setP = k => { p = K.ps[Math.min(K.ps.length - 1, Math.max(0, k))]; paint(); };
    maf.oninput = () => setP(+maf.value);
    maf.onchange = () => maf.blur();
    const glide = to => {
      cancelAnimationFrame(box.__snpRaf || 0);
      const from = beta, t0 = performance.now(), ms = 450;
      const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (still) { beta = to; paint(); return; }
      const frame = now => {
        if (!box.querySelector("#snp")) return;
        const k = Math.min(1, (now - t0) / ms), t = 1 - Math.pow(1 - k, 3);
        beta = from + (to - from) * t; paint();
        if (k < 1) box.__snpRaf = requestAnimationFrame(frame); else { beta = to; paint(); }
      };
      box.__snpRaf = requestAnimationFrame(frame);
    };
    slider.oninput = () => { cancelAnimationFrame(box.__snpRaf || 0); beta = betaAt(+slider.value, K); paint(); };
    slider.onchange = () => slider.blur();
    box.querySelectorAll(".plot-presets [data-b]").forEach(b => b.onclick = () => glide(+b.dataset.b));
    box.querySelector("#sresbtn").onclick = e => {
      const on = box.querySelector("#snp").classList.toggle("resid");
      e.target.textContent = on ? "Hide residuals" : "Show residuals";
    };
    box.__nudge = step => {
      cancelAnimationFrame(box.__snpRaf || 0);
      beta = step > 0 ? (K.steps.find(v => v > beta + 1e-9) ?? K.bmax)
                      : ([...K.steps].reverse().find(v => v < beta - 1e-9) ?? 0);
      paint();
    };
    box.__nudgeN = dir => setP(K.ps.indexOf(p) + dir);
    paint();
    fitPresent();
  }

  // The colocalization demo. The knobs are yours, on screen only: one shared causal variant or two
  // different ones, and the LD between them (drag, click a preset, or ↑ ↓ by 0.05); shift ↑ ↓
  // switches between one and two variants.
  function drawColoc(box, cur){
    const sg = JSON.stringify(["coloc", cur.id, cur.s.title]);
    if (sg === shape) return;
    shape = sg;
    app.classList.add("wide");
    const { html, geom } = colocHTML(cur.s.title);
    box.innerHTML = html;
    const st = { same: false, ld: 0.8, cause: false };
    const paint = () => colocPaint(box, geom, st);
    const slider = box.querySelector("#cld");
    slider.oninput = () => { st.ld = +slider.value / 100; paint(); };
    slider.onchange = () => slider.blur();
    box.querySelectorAll("[data-ld]").forEach(b => b.onclick = () => { st.ld = +b.dataset.ld; paint(); });
    box.querySelectorAll("[data-same]").forEach(b => b.onclick = () => { st.same = b.dataset.same === "1"; paint(); });
    box.querySelector("#ccausebtn").onclick = () => { st.cause = !st.cause; paint(); };
    box.__nudge = step => { if (st.same) return; st.ld = Math.round(Math.min(1, Math.max(0, st.ld + step)) * 100) / 100; paint(); };
    box.__nudgeN = () => { st.same = !st.same; paint(); };
    paint();
    fitPresent();
  }

  // The class eQTL scan on screen. Which genes are the class's comes from the votes (each vote
  // is stored under the student's sign-in id, which picks their gene). The view of all 20,000
  // genes is yours, on screen only; which genes are real (T) goes to phones too.
  let scanAll = false;
  const scanTruth = () => updateDoc(roomRef(room), { truth: !roomData.truth });
  const scanGenomeToggle = () => { scanAll = !scanAll; drawResults(); };
  function drawScan(box, cur){
    const qid = slideQids(cur.s)[0], vs = (qid && votes[qid]) || [];
    const reveal = !roomData.open && !!roomData.reveal, truth = !!roomData.truth;
    const sg = JSON.stringify(["scan", cur.id, cur.s.title, reveal, truth, scanAll,
                               reveal ? vs.map(v => [v.uid, v.choice]) : vs.length]);
    if (sg === shape) return;
    shape = sg;
    app.classList.add("wide");
    const genes = reveal ? vs.filter(v => v.uid && Number.isInteger(v.choice))
      .map(v => ({ ...scanGene(cur.id, scanIndex(cur.id, v.uid)), said: v.choice === 0 })) : [];
    box.innerHTML = scanScreenHTML({ title: cur.s.title || SCAN_TITLE, reveal, truth, n: vs.length,
                                     all: reveal && scanAll, genes, genome: reveal && scanAll ? scanGenome(cur.id) : null });
    box.querySelectorAll(".seg [data-all]").forEach(b => b.onclick = () => { if (scanAll !== (b.dataset.all === "1")) scanGenomeToggle(); });
    const tb = box.querySelector("#scantruth");
    if (tb) tb.onclick = scanTruth;
    fitPresent();
  }

  function drawPrs(){
    const el = document.getElementById("prsbody"), btn = document.getElementById("prsgo");
    if (!PRS) {
      btn.disabled = true;
      el.innerHTML = `<p class="warn" style="margin:0">The activity's data file (prs-height.js) didn't load.</p>`;
      return;
    }
    const on = roomData.activity === "prs", list = roster();
    btn.textContent = on ? "Back to polls" : "Show on phones";
    btn.className = "small" + (on ? "" : " primary");
    btn.disabled = !on && !list.length;
    const s = JSON.stringify([on, list, prsEditing]);
    if (s === prsSig) return;
    prsSig = s;
    if (!list.length || prsEditing) {
      el.innerHTML = `
        <label for="prsnames">Class list, one name per line</label>
        <textarea id="prsnames" style="min-height:170px" placeholder="First Last&#10;First Last">${esc(list.map(r => r.n).join("\n"))}</textarea>
        <div class="row" style="margin-top:10px">
          <button class="primary small" id="prsdeal">${list.length ? "Save and deal again" : "Deal out celebrities"}</button>
          ${list.length ? `<button class="ghost small" id="prscancel">Cancel</button>` : ""}
          <span class="muted" id="prsmsg"></span>
        </div>
        <p class="muted" style="margin:8px 0 0">${PRS.people.length} celebrities, dealt out at random. The class list is
          stored in your Firebase project, not in the public site.</p>`;
      document.getElementById("prsdeal").onclick = async () => {
        const names = document.getElementById("prsnames").value.split("\n").map(x => x.trim()).filter(Boolean);
        if (!names.length) { document.getElementById("prsmsg").textContent = "Add at least one name."; return; }
        if (names.length > 300) { document.getElementById("prsmsg").textContent = "That's more than 300 names."; return; }
        prsEditing = false;
        await updateDoc(roomRef(room), { roster: dealCelebs(names) });
      };
      const cancel = document.getElementById("prscancel");
      if (cancel) cancel.onclick = () => { prsEditing = false; drawPrs(); };
      return;
    }
    el.innerHTML = `
      <p class="muted" style="margin:0 0 10px">${list.length} students, ${PRS.people.length} celebrities${
        list.length > PRS.people.length ? " (some are used twice)" : ""}. ${on
        ? "Phones show the class list; each student taps their name."
        : "Press <b>Show on phones</b> when you're ready. Showing a poll afterwards brings phones back."}</p>
      <details class="prs-ans">
        <summary>Who has which celebrity, and the answers</summary>
        <table class="prs-key"><thead><tr><th>Student</th><th>Celebrity</th><th>PRS (cm)</th><th>Height (cm)</th></tr></thead><tbody>
          ${list.map(r => `<tr><td>${esc(r.n)}</td><td>${esc(PRS.people[r.c].name)}</td><td>${prsScore(r.c).toFixed(2)}</td><td>${prsHeight(r.c).toFixed(2)}</td></tr>`).join("")}
        </tbody></table>
      </details>
      <div class="row" style="margin-top:10px">
        <button class="ghost small" id="prsedit">Edit class list</button>
        <button class="ghost small" id="prsredeal">Deal again</button>
      </div>`;
    document.getElementById("prsedit").onclick = () => { prsEditing = true; drawPrs(); };
    document.getElementById("prsredeal").onclick = () => {
      if (confirm("Deal the celebrities out again? Students will get different ones."))
        updateDoc(roomRef(room), { roster: dealCelebs(list.map(r => r.n)) });
    };
  }

  /* ---- keyboard, for presenting ---- */
  addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (typing) return;
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === " ") { e.preventDefault(); spaceKey(); }
    else if (e.key === "r" || e.key === "R") toggleReveal();
    else if (e.key === "p" || e.key === "P") repoll();
    else if ((e.key === "t" || e.key === "T" || e.key === "g" || e.key === "G") && document.querySelector("#results #scan")) {
      if (e.key.toLowerCase() === "t") scanTruth(); else scanGenomeToggle();
    }
    else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && document.querySelector("#results #plot, #results #snp, #results #coloc")) {
      e.preventDefault();
      const box = document.getElementById("results"), up = e.key === "ArrowUp";
      if (e.shiftKey && box.__nudgeN) box.__nudgeN(up ? 1 : -1);
      else box.__nudge(up ? 0.05 : -0.05);
    }
    else if (e.key === "Escape") setPresent(false);
  });

  /* ---- subscriptions ---- */
  onSnapshot(roomRef(room), s => {
    if (!s.exists()) return;
    roomData = s.data();
    refresh();
  });

  onSnapshot(query(qsRef(room), orderBy("order")), s => {
    questions = s.docs.map(d => ({ id: d.id, ...d.data() }));
    qLoaded = true;
    refresh();
  });

  onSnapshot(query(slidesRef(room), orderBy("order")), s => {
    slides = s.docs.map(d => ({ id: d.id, ...d.data() }));
    sLoaded = true;
    refresh();
  }, () => {
    // Almost always: the project still has the rules from before slides.
    sLoaded = true;
    document.getElementById("ruleswarn").hidden = false;
    refresh();
  });

  onSnapshot(asksRef(room), s => {
    asks = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.at || 0) - (b.at || 0));
    drawQA(); drawSpot(); syncTicker();
  }, () => {
    // The project still has rules from before student questions.
    asksBlocked = true;
    drawQA();
  });

  function refresh(){
    bindVotes(liveIds());
    drawList(); drawLive(); drawResults(); drawQA(); drawSpot(); drawPrs(); syncTicker();
    syncShow();
  }

  function bindVotes(ids){
    for (const [id, unsub] of voteUnsubs)
      if (!ids.includes(id)) { unsub(); voteUnsubs.delete(id); delete votes[id]; }
    for (const id of ids) {
      if (voteUnsubs.has(id)) continue;
      votes[id] = [];
      voteUnsubs.set(id, onSnapshot(votesRef(room, id), s => {
        votes[id] = s.docs.map(d => ({ ...d.data(), uid: d.id }));
        drawLive(); drawResults();
      }));
    }
  }

  // If a slide is edited while it's showing, push the change to phones.
  let syncing = false;
  async function syncShow(){
    if (!qLoaded || !sLoaded || syncing || !roomData.current) return;
    const it = items().find(x => x.id === roomData.current);
    if (!it) return;
    const show = showFor(it), title = titleFor(it);
    if (JSON.stringify(show) === JSON.stringify(roomData.show || null) && (roomData.title ?? null) === title) return;
    syncing = true;
    try { await updateDoc(roomRef(room), { show, title }); } finally { syncing = false; }
  }

  /* ---- rendering ---- */
  // Guard every rebuild with a signature: a snapshot that changes nothing
  // this block shows must not replace its DOM, or a button can be swapped
  // out from under the click that's landing on it.
  let listSig = null, liveSig = null;
  function drawList(){
    const el = document.getElementById("qlist");
    const list = items();
    const num = numbering();
    const onSlides = new Set(slides.flatMap(s => s.qids || []));
    const loose = questions.filter(q => !standalone(q) && !onSlides.has(q.id));
    const s = JSON.stringify([
      list.map(it => it.kind === "q"
        ? [it.id, it.q.question, (it.q.options || []).length]
        : [it.id, it.s.title, slideQids(it.s).map(id => [id, qById(id).question, standalone(qById(id))])]),
      loose.map(q => [q.id, q.question, (q.options || []).length]),
      roomData.current]);
    if (s === listSig) return;
    listSig = s;
    if (!list.length && !loose.length) {
      el.innerHTML = `<p class="muted" style="margin:0">No questions yet. Add them before class — you can prepare the whole lecture here.</p>`;
      return;
    }
    const appear = appearances();
    el.innerHTML = list.map((it, i) => {
      const live = it.id === roomData.current;
      const show = `<button class="small ${live ? "ghost" : "primary"}"
                  onclick="__show('${it.id}')">${live ? "Reshow" : "Show"}</button>`;
      const moves = `<button class="small ghost move" onclick="__move('${it.id}',-1)" ${i === 0 ? "disabled" : ""} title="Move up">&uarr;</button>
          <button class="small ghost move" onclick="__move('${it.id}',1)" ${i === list.length - 1 ? "disabled" : ""} title="Move down">&darr;</button>`;
      if (it.kind === "q") return `
      <div class="qitem ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <span class="body">
          <span class="t">${esc(it.q.question)}</span>
          <span class="m">${(it.q.options || []).length} options${live ? " · showing now" : ""} ${onceTag(appear, it.id, i + 1)}</span>
        </span>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__edit('${it.id}')">Edit</button>
          <button class="small ghost" onclick="__del('${it.id}')">Delete</button>
          ${moves}
        </span>
      </div>`;
      if (stepOf(it) === "snp" || stepOf(it) === "eqtl") return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <span class="body">
          <span class="t">${esc(it.s.title || SNP_KINDS[stepOf(it)].title)}</span>
          <span class="m">${stepOf(it) === "snp" ? "Height" : "A gene's expression"} against one SNP's genotype, with an effect-size knob${live ? " · showing now" : ""}</span>
        </span>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__delSlide('${it.id}')">Remove</button>
          ${moves}
        </span>
      </div>`;
      if (stepOf(it) === "coloc") return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <span class="body">
          <span class="t">${esc(it.s.title || COLOC_TITLE)}</span>
          <span class="m">GWAS and eQTL at one locus, with an LD knob and coloc's verdict${live ? " · showing now" : ""}</span>
        </span>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__delSlide('${it.id}')">Remove</button>
          ${moves}
        </span>
      </div>`;
      if (stepOf(it) === "scan") return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <span class="body">
          <span class="t">${esc(it.s.title || SCAN_TITLE)}</span>
          <span class="m">Class eQTL scan · each phone judges one gene, then p-values and thresholds on screen${live ? " · showing now" : ""}</span>
        </span>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__delSlide('${it.id}')">Remove</button>
          ${moves}
        </span>
      </div>`;
      if (stepOf(it) === "image") return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <div class="body">
          <span class="t">${esc(it.s.title || "Image")}</span>
          <span class="m">Image · on the projector and phones${live ? " · showing now" : ""}</span>
          ${safeSrc(it.s.src) ? `<img class="thumb" src="${esc(it.s.src)}" alt="">` : `<span class="m">Can't show this image: ${esc(it.s.src || "no file")}</span>`}
        </div>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__delSlide('${it.id}')">Remove</button>
          ${moves}
        </span>
      </div>`;
      if (stepOf(it) === "discuss") return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <div class="body">
          <span class="t">${esc(it.s.title)}</span>
          <span class="m">Discussion${live ? " · showing now" : ""}</span>
          <ul class="sub">${(it.s.points || []).map(pt => `<li><span>&bull;</span><span>${esc(pt)}</span></li>`).join("")}</ul>
        </div>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__delSlide('${it.id}')">Remove</button>
          ${moves}
        </span>
      </div>`;
      if (stepOf(it)) return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <span class="body">
          <span class="t">${STEP_NAME[stepOf(it)]}</span>
          <span class="m">${stepOf(it) === "prs" ? "Each phone shows its student's celebrity" : "Score against height, with the R² knob"}${live ? " · showing now" : ""}</span>
        </span>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__delSlide('${it.id}')">Remove</button>
          ${moves}
        </span>
      </div>`;
      const ids = slideQids(it.s);
      return `
      <div class="qitem slide ${live ? "live" : ""}">
        <span class="n">${i + 1}</span>
        <div class="body">
          <span class="t">${esc(it.s.title || "Untitled slide")}</span>
          <span class="m">Slide · ${ids.length} question${ids.length === 1 ? "" : "s"}${live ? " · showing now" : ""}</span>
          <ul class="sub">${ids.map(id => `
            <li><span>${num[id] ? "#" + num[id] : "&bull;"}</span><span>${esc(qById(id).question)} ${onceTag(appear, id, i + 1)}</span>${
              standalone(qById(id)) ? "" : `<button class="ghost" onclick="__edit('${id}')">Edit</button>`}</li>`).join("")}
          </ul>
        </div>
        <span class="acts">
          ${show}
          <button class="small ghost" onclick="__editSlide('${it.id}')">Edit</button>
          <button class="small ghost" onclick="__delSlide('${it.id}')">Delete</button>
          ${moves}
        </span>
      </div>`;
    }).join("") + (loose.length ? `
      <div class="loose">
        <p class="muted" style="margin:0 0 8px">Slide-only questions that aren't on a slide yet.
          Add them to one with <b>Edit</b> on a slide, or <b>+ Add slide</b>.</p>
        ${loose.map(q => `
        <div class="qitem">
          <span class="n">&ndash;</span>
          <span class="body">
            <span class="t">${esc(q.question)}</span>
            <span class="m">${(q.options || []).length} options · slide only</span>
          </span>
          <span class="acts">
            <button class="small ghost" onclick="__edit('${q.id}')">Edit</button>
            <button class="small ghost" onclick="__del('${q.id}')">Delete</button>
          </span>
        </div>`).join("")}
      </div>` : "");
  }

  function drawLive(){
    const el = document.getElementById("live");
    const list = items();
    const i = list.findIndex(x => x.id === roomData.current);
    const it = list[i];
    const ids = liveIds();
    const totals = ids.map(id => tally(qById(id), votes[id] || []).total);
    const countText = ids.length > 1
      ? `responses ${totals.join(" · ")}`
      : `${totals[0] || 0} response${totals[0] === 1 ? "" : "s"}`;
    // A slide that brings back questions asked earlier is the second time around:
    // nudge toward Re-poll until it's been pressed.
    const revisit = i >= 0 && isRevisit(list, i) && !ids.every(id => qById(id).earlier);
    const appear = appearances(), once = stepOf(it) ? 0 : ids.filter(id => askedOnce(appear, id)).length;
    const scan = stepOf(it) === "scan";
    const s = JSON.stringify([roomData.current, roomData.open, !!roomData.reveal, !!roomData.truth, revisit, i, list.length, ids.length, once]);

    // Only the response count moves as votes land — update it in place so
    // the controls underneath the instructor's cursor stay put.
    if (s === liveSig) {
      const c = document.getElementById("livecount");
      if (c) c.textContent = countText;
      return;
    }
    liveSig = s;

    if (!roomData.current) {
      el.innerHTML = `<p class="muted" style="margin:0">Nothing is showing to students — they see a "waiting" screen.
        Hit <b>Show</b> on a question or slide to push it to their phones.</p>`;
      return;
    }
    const what = stepOf(it) ? `Step ${i + 1} of ${list.length} · ${STEP_NAME[stepOf(it)] || "Discussion"}`
      : it && it.kind === "s"
      ? `Slide ${i + 1} of ${list.length} · ${ids.length} question${ids.length === 1 ? "" : "s"}`
      : i >= 0 ? `Question ${i + 1} of ${list.length}` : "Showing";
    el.innerHTML = `
      <div class="row spread">
        <div class="row">
          <span class="pill ${roomData.open ? "open" : "closed"}">${roomData.open ? "open" : "closed"}</span>
          <span class="pill closed">${roomData.reveal ? "results showing" : "results hidden"}</span>
          <span class="muted">${what} · <span id="livecount">${countText}</span></span>
        </div>
        <div class="row">
          <button class="small" id="prev" ${i <= 0 ? "disabled" : ""}>&larr; Prev</button>
          <button class="small" id="next" ${i < 0 || i >= list.length - 1 ? "disabled" : ""}>Next &rarr;</button>
          <button class="small ${roomData.open ? "" : "primary"}" id="toggle">${roomData.open ? "Close voting" : "Open voting"}</button>
          <button class="small ghost" id="reveal">${roomData.reveal ? "Hide results" : "Show results"}</button>
          <button class="small ${revisit ? "primary" : "ghost"}" id="repoll" ${ids.length ? "" : "disabled"}
                  title="Save these results as the first round, clear the votes and reopen voting">Re-poll</button>
          <button class="small ghost" id="clear">Clear votes</button>
          <button class="small ghost" id="hide">Hide</button>
        </div>
      </div>
      ${once ? `<p class="warn" style="margin:12px 0 0">${once === ids.length
        ? (ids.length === 1 ? "This question doesn't come back later" : "None of these questions come back later")
        : `${once} of these questions ${once === 1 ? "doesn't" : "don't"} come back later`}: go through ${once === 1 ? "it" : "them"} now
        (<kbd>space</kbd> closes voting, <kbd>space</kbd> again reveals).</p>` : ""}
      ${scan ? `<p class="warn" style="margin:12px 0 0">Class eQTL scan: each phone shows one gene; students vote eQTL or not.
        <kbd>space</kbd> closes voting, <kbd>space</kbd> again shows the p-values. Then <kbd>T</kbd> shows which genes are
        really eQTLs (${roomData.truth ? "showing now, on phones too" : "on phones too"}), and <kbd>G</kbd> switches between the class's genes and all
        ${fmtCount(SCAN_G)}.</p>` : ""}
      ${revisit ? `<p class="warn" style="margin:12px 0 0">These questions were asked earlier. Press <b>Re-poll</b> (or <kbd>P</kbd>)
        to start the second round; closing voting afterwards shows before and after together.</p>` : ""}
      <p class="muted" style="margin:12px 0 0">
        Results stay hidden while voting is open. While presenting: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change question or slide,
        <kbd>space</kbd> closes voting, then reveals the results (a third press reopens voting),
        <kbd>R</kbd> shows or hides results, <kbd>P</kbd> re-polls,
        <kbd>esc</kbd> leaves present mode. A slide that brings back earlier questions starts their second round
        by itself; closing its voting shows before and after.</p>`;
    document.getElementById("prev").onclick   = () => step(-1);
    document.getElementById("next").onclick   = () => step(1);
    document.getElementById("toggle").onclick = toggleOpen;
    document.getElementById("reveal").onclick = toggleReveal;
    document.getElementById("repoll").onclick = repoll;
    document.getElementById("clear").onclick  = clearVotes;
    document.getElementById("hide").onclick   = hideAll;
  }

  // Unanswered first, in the order they came in; answered ones sink and fade.
  let qaSig = null;
  function drawQA(){
    const on = !!roomData.qa;
    const open = asks.filter(a => a.status !== "answered");
    const badge = document.getElementById("qabadge");
    badge.classList.toggle("has", open.length > 0);
    badge.textContent = `${open.length} student question${open.length === 1 ? "" : "s"}`;

    const s = JSON.stringify([on, tickerOn(), asksBlocked, roomData.spot || null, asks.map(a => [a.id, a.text, a.status || "", a.at, a.shown || 0])]);
    if (s === qaSig) return;
    qaSig = s;
    const toggle = document.getElementById("qatoggle");
    toggle.textContent = on ? "Stop taking questions" : "Let students ask";
    toggle.className = "small" + (on ? "" : " primary");
    document.getElementById("qaticker").textContent = tickerOn() ? "Stop scrolling on screen" : "Scroll on screen";
    document.getElementById("qaclear").disabled = !asks.length;
    document.getElementById("qacount").textContent = open.length ? `· ${open.length} open` : "";

    const el = document.getElementById("qalist");
    if (asksBlocked) {
      el.innerHTML = `<p class="warn" style="margin:0">Student questions can't load: this Firebase project still has
        older rules. Paste the new <code class="inline">firestore.rules</code> into Firestore &rarr; Rules &rarr; Publish.</p>`;
      return;
    }
    if (!asks.length) {
      el.innerHTML = `<p class="muted" style="margin:0">${on
        ? "Students can type questions on their phones now. They show up here, anonymously."
        : "Turn this on and students get a box on their phones to type questions in, anonymously. Only you see them."}</p>`;
      return;
    }
    const ordered = [...open, ...asks.filter(a => a.status === "answered")];
    el.innerHTML = ordered.map(a => {
      const done = a.status === "answered", here = roomData.spot === a.id;
      const passes = Math.min(a.shown || 0, PASSES), scrolled = passes >= PASSES;
      return `
      <div class="ask ${done ? "done" : ""} ${here ? "onscreen" : ""}">
        <span class="body">
          <span class="t">${esc(a.text)}</span>
          <span class="m">${clock(a.at)}${done ? " · answered" : ""}${here ? " · on screen" : ""}${
            passes && !done ? ` · scrolled ${passes}/${PASSES}` : ""}</span>
        </span>
        <span class="acts">
          ${done ? "" : `<button class="small ${here ? "ghost" : "primary"}" onclick="__spot('${a.id}')">${here ? "Take off screen" : "Show on screen"}</button>`}
          ${scrolled && !done ? `<button class="small ghost" onclick="__rescroll('${a.id}')">Scroll again</button>` : ""}
          <button class="small ghost" onclick="__answered('${a.id}')">${done ? "Reopen" : "Answered"}</button>
          <button class="small ghost" onclick="__delAsk('${a.id}')">Delete</button>
        </span>
      </div>`;
    }).join("");
  }

  // The student question on screen sits above the poll results, in present mode too.
  let spotSig = null;
  function drawSpot(){
    const a = roomData.spot && asks.find(x => x.id === roomData.spot);
    const s = a ? JSON.stringify([a.id, a.text]) : "";
    if (s === spotSig) return;
    spotSig = s;
    document.getElementById("spot").innerHTML = a ? `
      <div class="spotcard">
        <div><div class="lbl">Question from the class</div><div class="t">${esc(a.text)}</div></div>
        <button class="small ghost" onclick="__answered('${a.id}')" title="Mark answered and take it off the screen">Done</button>
      </div>` : "";
  }

  // Rebuild the results block only when what's showing changes; when just the
  // numbers move, update in place so bars animate instead of flashing.
  let shape = null;
  function drawResults(){
    const box = document.getElementById("results");
    const cur = items().find(x => x.id === roomData.current);
    if ((plotOn || stepOf(cur) === "plot") && PRS) return drawPlot(box);
    if (stepOf(cur) === "snp" || stepOf(cur) === "eqtl") return drawSnp(box, cur, SNP_KINDS[stepOf(cur)]);
    if (stepOf(cur) === "scan") return drawScan(box, cur);
    if (stepOf(cur) === "coloc") return drawColoc(box, cur);
    if (stepOf(cur) === "image") {
      const sig = JSON.stringify(["image", cur.id, cur.s.src]);
      if (sig !== shape) {
        shape = sig; app.classList.add("wide");
        box.innerHTML = figureHTML(cur.s.src, cur.s.title);
        const img = box.querySelector("img");
        if (img) img.onload = () => fitPresent();          // its size is known only once it loads
        fitPresent();
      }
      return;
    }
    if (stepOf(cur) === "discuss") {
      const sig = JSON.stringify(["discuss", cur.id, cur.s.title, cur.s.points]);
      if (sig !== shape) { shape = sig; app.classList.add("wide"); box.innerHTML = discussHTML(cur.s.title, cur.s.points); fitPresent(); }
      return;
    }
    if (roomData.activity === "prs" && PRS) {
      const s = JSON.stringify(["prs", roster()]);
      if (s !== shape) { shape = s; app.classList.add("wide"); box.innerHTML = prsScreenHTML(roster()); fitPresent(); }
      return;
    }
    const qs = (roomData.current ? liveIds() : []).map(qById);
    app.classList.toggle("wide", qs.length > 2);
    if (!qs.length) {
      shape = null;
      box.innerHTML = `<p class="muted" style="margin:0">No question is live.</p>`;
      return;
    }
    const hidden = !roomData.reveal;
    const tallies = qs.map(q => tally(q, votes[q.id] || []));
    const appear = appearances(), once = qs.map(q => askedOnce(appear, q.id));
    const nextShape = JSON.stringify([roomData.title || "", hidden, once, qs.map(q => [q.id, q.question, q.options, q.earlier || null])]);
    if (nextShape !== shape) {
      shape = nextShape;
      box.innerHTML = slideResultsHTML(roomData.title, qs, tallies, hidden);
      if (qs.length > 1) box.querySelectorAll(".result[data-q]").forEach((r, k) => r.classList.toggle("once", once[k]));
      fitPresent();
      if (!hidden) growBars(box);
      return;
    }
    qs.forEach((q, k) => {
      const block = box.querySelector(`[data-q="${q.id}"]`);
      if (block) paintResult(block, q, tallies[k].counts, tallies[k].total, hidden);
    });
  }
}

/* ==================================================================== */
/*  STUDENT VIEW — scan once, stays live all lecture                    */
/* ==================================================================== */
async function student(room){
  await ready;
  app.innerHTML = `<div id="s"><p class="muted">Connecting…</p></div>
    <div class="askzone" id="askzone" hidden>
      <div id="askform" hidden>
        <label for="askt">Ask your instructor a question</label>
        <textarea id="askt" maxlength="${MAX_ASK}" placeholder="Anonymous: your instructor sees the question, not who asked."></textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary small" id="asksend">Send question</button>
          <span class="muted" id="askmsg"></span>
        </div>
      </div>
      <div id="mine"></div>
    </div>`;
  const el = document.getElementById("s");

  let roomData = null;
  let qdata = {}, mine = {}, votes = {};      // keyed by question id
  let qKey = null, qUnsubs = [], vKey = null, vUnsubs = [];
  let failed = false;

  onSnapshot(roomRef(room), s => {
    if (!s.exists()) {
      el.innerHTML = `<h1>Session not found</h1><p class="sub">Check the code with your instructor.</p>`;
      return;
    }
    roomData = s.data();
    bind();
    draw();
    drawAsk();
  });

  // Sessions saved before slides existed have `current` but no `show`.
  const showIds = () => !roomData || !roomData.current ? []
    : Array.isArray(roomData.show) ? roomData.show : [roomData.current];

  function bind(){
    const ids = showIds();
    const k = JSON.stringify(ids);
    if (k !== qKey) {
      qKey = k;
      qUnsubs.forEach(u => u()); qUnsubs = [];
      qdata = {}; mine = {}; failed = false;
      for (const id of ids) {
        qUnsubs.push(onSnapshot(qRef(room, id), s => { qdata[id] = s.exists() ? s.data() : null; draw(); }));
        qUnsubs.push(onSnapshot(voteRef(room, id, uid), s => { mine[id] = s.exists() ? s.data().choice : null; draw(); }));
      }
    }
    // Classmates' votes are only needed once voting closes and the results are
    // revealed, so phones don't re-download the tally on every tap.
    const showing = !roomData.open && !!roomData.reveal;
    const vk = showing ? k : "none";
    if (vk !== vKey) {
      vKey = vk;
      vUnsubs.forEach(u => u()); vUnsubs = [];
      votes = {};
      if (showing) for (const id of ids)
        vUnsubs.push(onSnapshot(votesRef(room, id), s => { votes[id] = s.docs.map(d => d.data()); draw(); }));
    }
  }

  window.__vote = async (qid, i) => {
    if (!roomData || !roomData.open || !showIds().includes(qid)) return;
    try {
      await setDoc(voteRef(room, qid, uid), { choice: i, at: Date.now() });
      if (failed) { failed = false; draw(); }
    } catch {
      failed = true; draw();
    }
  };

  /* ---- typing in a question ---- */
  // Only this student's own questions are readable, so the query must ask for exactly those.
  let myAsks = [], asksOk = true, askSig = null;
  onSnapshot(query(asksRef(room), where("by", "==", uid)), s => {
    myAsks = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.at || 0) - (b.at || 0));
    drawAsk();
  }, () => { asksOk = false; drawAsk(); });

  const askt = document.getElementById("askt"), asksend = document.getElementById("asksend");
  let cooling = false;
  function askMsg(t){
    const m = document.getElementById("askmsg");
    m.textContent = t;
    setTimeout(() => { if (m.textContent === t) m.textContent = ""; }, 4000);
  }
  asksend.onclick = async () => {
    const text = askt.value.trim();
    if (!text || cooling) return;
    if (text.length > MAX_ASK) return askMsg(`Keep it under ${MAX_ASK} characters.`);
    asksend.disabled = true;
    try {
      await setDoc(askRef(room, newAid()), { text, by: uid, at: Date.now() });
      askt.value = "";
      askMsg("Sent.");
      // A short pause between questions keeps one phone from flooding the list.
      cooling = true;
      setTimeout(() => { cooling = false; asksend.disabled = false; }, 8000);
    } catch {
      asksend.disabled = false;
      askMsg("Didn't send. Your instructor may have just stopped taking questions.");
    }
  };
  window.__withdraw = id => deleteDoc(askRef(room, id)).catch(() => {});

  // The form is built once and only shown or hidden, so a half-typed question
  // survives everything else on the page changing.
  function drawAsk(){
    if (!roomData) return;
    const on = !!roomData.qa && asksOk;
    document.getElementById("askform").hidden = !on;
    document.getElementById("askzone").hidden = !on && !myAsks.length;
    const s = JSON.stringify(myAsks.map(a => [a.id, a.text, a.status || ""]));
    if (s === askSig) return;
    askSig = s;
    document.getElementById("mine").innerHTML = myAsks.length ? `
      <div class="mine">
        <label>Your questions</label>
        ${myAsks.map(a => `
        <div class="ask ${a.status === "answered" ? "done" : ""}">
          <span class="body">
            <span class="t">${esc(a.text)}</span>
            <span class="m">${a.status === "answered" ? "Answered" : "Sent " + clock(a.at)}</span>
          </span>
          ${a.status === "answered" ? "" : `<span class="acts"><button class="small ghost" onclick="__withdraw('${a.id}')">Remove</button></span>`}
        </div>`).join("")}
      </div>` : "";
  }

  // Re-render only when something this student can SEE changes — otherwise
  // the page would rebuild on every incoming vote and swallow a tap.
  // The activity: tap your name, see your celebrity's genotypes. Which name this phone
  // picked is remembered on the phone, so a reload goes straight back to it.
  const PRS_KEY = "prs:" + room;
  function prsMe(){
    const list = Array.isArray(roomData.roster) ? roomData.roster : [];
    try {
      const me = JSON.parse(localStorage.getItem(PRS_KEY) || "null");
      if (me && list[me.i] && list[me.i].n === me.n) return me.i;
    } catch {}
    return null;
  }
  window.__prsPick = i => {
    const list = roomData.roster || [];
    try {
      if (i < 0) localStorage.removeItem(PRS_KEY);
      else localStorage.setItem(PRS_KEY, JSON.stringify({ i, n: list[i].n }));
    } catch {}
    sig = null; draw(); scrollTo(0, 0);
  };
  function prsStudentHTML(){
    const list = Array.isArray(roomData.roster) ? roomData.roster : [];
    if (!PRS) return `<div class="status wait">This activity couldn't load. Reload the page.</div>`;
    if (!list.length) return `<div class="status wait">Your instructor is getting the class list ready — keep this page open.</div>`;
    const me = prsMe();
    if (me === null) return `
      <div class="stitle">Height polygenic score</div>
      <div class="status">Tap your name to get your celebrity.</div>
      ${list.map((r, i) => `<button class="choice who" onclick="__prsPick(${i})"><span>${esc(r.n)}</span></button>`).join("")}`;
    const person = PRS.people[list[me].c];
    return `
      <div class="stitle">Height polygenic score</div>
      <p class="muted" style="margin:0">${esc(list[me].n.split(" ")[0])}, your celebrity is</p>
      <div class="celeb">${esc(person.name)}</div>
      <p style="margin:0 0 14px">Predict their height. First the polygenic score (PRS): for each of the 18 SNPs, multiply
        the effect (β, in cm per copy) by the number of copies of the effect allele, then add them all up.</p>
      <table class="geno">
        <thead><tr><th>#</th><th>SNP</th><th class="c">Effect allele</th><th class="greek">β (cm)</th><th class="c">Copies</th></tr></thead>
        <tbody>${PRS.snps.map((snp, k) => `
          <tr><td class="n">${k + 1}</td><td>${esc(snp.id)}</td><td class="c">${esc(snp.effect)}</td>
              <td>${prsBeta(k).toFixed(2)}</td><td class="c">${person.dosage[k]}</td></tr>`).join("")}
        </tbody>
      </table>
      <p class="prs-sum">Predicted height = average height + PRS<br><b>= ${prsMean().toFixed(1)} cm + PRS</b>
        <span class="muted">${prsMean().toFixed(1)} cm is the average height of our celebrities. A negative PRS means shorter than average.</span></p>
      <p style="margin:14px 0 0"><button class="ghost small" onclick="__prsPick(-1)">Not you? Pick your name again</button></p>`;
  }

  let sig = null;
  function draw(){
    if (!roomData) return;
    if (roomData.activity === "screen") {
      if (sig === "screen") return;
      sig = "screen";
      el.innerHTML = `<div class="status wait">Look at the screen.</div>`;
      return;
    }
    if (roomData.activity === "image") {
      const next = JSON.stringify(["image", roomData.src || ""]);
      if (next === sig) return;
      sig = next;
      el.innerHTML = `<div class="status wait">Look at the screen.</div>` + (safeSrc(roomData.src)
        ? `<a href="${esc(roomData.src)}" target="_blank" rel="noopener">${figureHTML(roomData.src, roomData.title)}</a>
           <p class="muted" style="margin:10px 0 0">Tap the picture to open it full size.</p>` : "");
      return;
    }
    if (roomData.activity === "discuss") {
      const next = JSON.stringify(["discuss", roomData.title || "", roomData.points || []]);
      if (next === sig) return;
      sig = next;
      el.innerHTML = `<div class="status wait">Talk it over with the people around you.</div>` + discussHTML(roomData.title, roomData.points);
      return;
    }
    if (roomData.activity === "scan") {
      // This student's gene comes from their sign-in id, so it's the same after a reload.
      const qid = showIds()[0];
      if (!qid || !(qid in mine)) return;          // keep the current screen until the vote snapshot lands
      const open = !!roomData.open, reveal = !open && !!roomData.reveal, truth = !!roomData.truth;
      const next = JSON.stringify(["scan", roomData.current, qid, open, reveal, truth, mine[qid] ?? null, failed]);
      if (next === sig) return;
      sig = next;
      const gene = scanGene(roomData.current, scanIndex(roomData.current, uid));
      el.innerHTML = scanStudentHTML(gene, qid, mine[qid] ?? null, open, reveal, truth, failed);
      return;
    }
    if (roomData.activity === "prs") {
      const next = JSON.stringify(["prs", roomData.roster || [], prsMe()]);
      if (next === sig) return;
      sig = next;
      el.innerHTML = prsStudentHTML();
      return;
    }
    const ids = showIds();
    const open = !!roomData.open, reveal = !!roomData.reveal;
    const loaded = ids.every(id => id in qdata && (open ? id in mine : !reveal || id in votes));
    if (!loaded) return;            // keep the current screen until the first snapshots land
    const qs = ids.map(id => qdata[id] && { id, ...qdata[id] }).filter(Boolean);
    const title = roomData.title || "";
    const next = !qs.length
      ? JSON.stringify(["wait"])
      : open ? JSON.stringify(["open", title, failed, qs.map(q => [q.id, q.question, q.options, mine[q.id] ?? null])])
             : JSON.stringify(["closed", title, reveal, qs.map(q => [q.id, q.question, q.options, q.earlier || null, reveal ? tally(q, votes[q.id] || []).counts : null])]);
    if (next === sig) return;
    sig = next;

    if (!qs.length) {
      el.innerHTML = `<div class="status wait">Waiting for the next question — keep this page open.</div>`;
      return;
    }
    const head = title ? `<div class="stitle">${esc(title)}</div>` : "";
    if (!open) {
      const tallies = qs.map(q => tally(q, votes[q.id] || []));
      const showing = reveal && tallies.some(t => t.total);
      el.innerHTML = showing
        ? `<div class="status">Voting is closed — here are the results.</div>${slideResultsHTML(title, qs, tallies, false)}`
        : `<div class="status wait">Voting is closed. Results will be shared later — keep this page open.</div>
           ${head}${qs.map(q => `<div class="qtext">${esc(q.question || "")}</div>`).join("")}`;
      if (showing) growBars(el);
      return;
    }
    const many = qs.length > 1;
    const done = qs.filter(q => mine[q.id] != null).length;
    const status = failed
      ? `<div class="status">That answer didn't go through — voting may have just closed.</div>`
      : done === 0 ? `<div class="status">${many ? `${qs.length} questions — pick one answer for each.` : "Pick one answer."}</div>`
      : done < qs.length ? `<div class="status">${done} of ${qs.length} answered — scroll for the rest.</div>`
      : `<div class="status ok">${many ? "All answers recorded — tap another option to change any of them."
                                       : "Answer recorded — tap another option to change it."}</div>`;
    el.innerHTML = status + head + qs.map((q, k) => `
      <div class="sq">
        ${many ? `<div class="qnum">Question ${k + 1} of ${qs.length}${mine[q.id] != null ? " · answered" : ""}</div>` : ""}
        <div class="qtext">${esc(q.question || "Question")}</div>
        ${(q.options || []).map((o, i) => `
          <button class="choice" aria-pressed="${mine[q.id] === i}" onclick="__vote('${q.id}', ${i})">
            <span class="tag">${LETTERS[i]}</span>
            <span>${esc(o)}</span>
          </button>`).join("")}
      </div>`).join("");
  }
}

/* ==================================================================== */
/*  LANDING + ROUTER                                                    */
/* ==================================================================== */
function landing(){
  app.innerHTML = `
    <h1>Live Poll</h1>
    <p class="sub">One QR code per lecture. Push questions to it as you go.</p>
    <div class="panel"><button class="primary" id="start">Start a session</button></div>
    <div class="panel">
      <label for="jc">Joining as a student?</label>
      <div class="row">
        <input type="text" id="jc" placeholder="4-letter code" maxlength="4"
               style="max-width:180px;text-transform:uppercase;letter-spacing:.1em">
        <button id="join">Join</button>
      </div>
    </div>`;
  document.getElementById("start").onclick = () => { location.hash = "#t/" + newCode(); };
  const go = () => {
    const c = document.getElementById("jc").value.trim().toUpperCase();
    if (c.length === 4) location.hash = "#p/" + c;
  };
  document.getElementById("join").onclick = go;
  document.getElementById("jc").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function route(){
  setPresent(false);
  const m = location.hash.match(/^#(t|p)\/([A-Z0-9]{4})$/i);
  if (!m) return landing();
  const mode = m[1].toLowerCase(), code = m[2].toUpperCase();
  (mode === "t" ? teacher : student)(code).catch(e => {
    fatal("Something went wrong", esc(e && e.message || e) +
      `<br><br><span class="muted">Most often this means Anonymous sign-in isn't enabled in
       Firebase Authentication, or the Firestore rules haven't been published yet.</span>`);
  });
}

let lastHash = location.hash;
addEventListener("hashchange", () => {
  const a = /^#t\//.test(location.hash), b = /^#t\//.test(lastHash);
  lastHash = location.hash;
  if (a || b) location.reload(); else route();
});
route();
</script>
