<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">

<style>
  :root{
    --bg:#fafafa; --panel:#fff; --ink:#1c1c1e; --muted:#696970;
    --line:#e4e4e8; --accent:#800000; --accent-soft:#f7ecec; --accent-ink:#6b0f0f;
    --ok:#2f6f4f; --radius:12px;
    --bar:#97a1ad; --bar-lead:#800000; --track:#ececef; --tag:#3a3d43; --steel:#3d6b8e;
    --font:"Source Sans 3",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 var(--font);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px}
  h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:1.05rem;margin:0 0 12px;letter-spacing:-.01em}
  p.sub{color:var(--muted);margin:0 0 24px;font-size:.92rem}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  input[type=text],textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;color:var(--ink)
  }
  textarea{min-height:64px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{
    font:inherit;font-weight:500;cursor:pointer;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px
  }
  button:hover{border-color:#cdc7c0}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.07)}
  button.ghost{background:transparent}
  button.small{padding:6px 10px;font-size:.85rem}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spread{justify-content:space-between}
  .opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .tag{background:var(--tag)}
  .opt-row .tag{width:26px;height:26px;flex:0 0 26px;border-radius:6px;display:grid;place-items:center;font-size:.8rem;font-weight:600;color:#fff}
  .opt-row button{padding:6px 10px;flex:0 0 auto}
  .muted{color:var(--muted);font-size:.88rem}

  /* question list */
  .qitem{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:#fff}
  .qitem.live{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
  .qitem .n{flex:0 0 24px;width:24px;height:24px;border-radius:6px;background:#f0ece7;color:var(--muted);
    display:grid;place-items:center;font-size:.78rem;font-weight:700}
  .qitem.live .n{background:var(--accent);color:#fff}
  .qitem .body{flex:1 1 auto;min-width:0}
  .qitem .t{font-weight:500;overflow-wrap:anywhere}
  .qitem .m{font-size:.8rem;color:var(--muted);margin-top:2px}
  .qitem .t,.qitem .m{display:block}
  .qitem .acts{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap}

  /* results */
  .qtext{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;margin:0 0 20px;line-height:1.25;text-wrap:balance}
  .bar{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:.95rem;margin-bottom:5px}
  .bar-label{display:flex;gap:8px;align-items:flex-start;min-width:0;flex:1 1 auto}
  .bar-label .tag{width:22px;height:22px;flex:0 0 22px;border-radius:5px;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff}
  .bar-label > span:last-child{min-width:0;overflow-wrap:anywhere}
  .bar-num{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar-num b{color:var(--ink)}
  .track{position:relative;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
  .fill{height:100%;border-radius:7px;width:0;background:var(--bar);transition:width .8s cubic-bezier(.2,.7,.3,1)}
  .fill.lead{background:var(--bar-lead)}
  /* after a re-poll: a pale "before" bar above each solid "after" bar */
  .track.then{height:7px;margin-bottom:4px;background:transparent}
  .track.then .fill{background:var(--bar);opacity:.45}
  .bar-num .then{color:var(--muted)}
  .key{display:flex;gap:18px;font-size:.8rem;color:var(--muted);margin:0 0 12px}
  .key i{display:inline-block;width:22px;height:9px;border-radius:5px;background:var(--bar);
    vertical-align:middle;margin-right:6px}
  .key i.then{height:4px;opacity:.45}
  .total{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);margin-top:18px}
  .bar-num{font-weight:600;font-variant-numeric:tabular-nums}
  .count{display:flex;align-items:baseline;gap:.45em;color:var(--muted)}
  .count b{display:inline-block;font-size:2.6rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
  .count b.bump{animation:bump .35s ease-out}
  .hush{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
  @keyframes bump{from{transform:scale(1.3)}to{transform:scale(1)}}
  .revealing .bar-num,.revealing .key{animation:fadein .5s 1s both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  /* slides: several questions at once */
  .stitle{font-size:.85rem;font-weight:700;color:var(--accent);margin:0 0 16px;letter-spacing:.08em;text-transform:uppercase}
  /* Each question spans three shared rows (prompt, bars, total), so when prompts
     wrap to different lengths the bars still start level across the columns. */
  .rgrid{display:grid;column-gap:40px;row-gap:0}
  .rgrid .result{display:grid;grid-template-columns:minmax(0,1fr);grid-row:span 3;grid-template-rows:subgrid;row-gap:0}
  .rgrid .qtext{font-size:1.15rem;margin-bottom:14px}
  .rgrid .total{margin:8px 0 28px}
  .result{min-width:0}
  @media (min-width:760px){ .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .qitem.slide .n{background:#e3e9ef;color:var(--steel)}
  .qitem.slide.live .n{background:var(--accent);color:#fff}
  .qitem .sub{list-style:none;margin:6px 0 0;padding:0;font-size:.85rem;color:var(--muted)}
  .qitem .sub li{display:flex;gap:6px;align-items:baseline;margin-top:3px}
  .qitem .sub li > span:first-child{flex:0 0 auto;min-width:1.6em}
  .qitem .sub li > span + span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .qitem .sub button{flex:0 0 auto;white-space:nowrap;padding:1px 7px;font-size:.75rem}
  .qitem .move{padding:6px 8px}
  .loose{margin-top:14px}
  label.check{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;
    font-size:.92rem;color:var(--ink);margin:0 0 8px;cursor:pointer}
  label.check input{margin-top:.3em;accent-color:var(--accent)}
  .sq + .sq{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
  .qnum{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .warn{color:var(--accent-ink);font-size:.88rem;margin:10px 0 0}

  /* student questions */
  .ask{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;background:#fff}
  .ask.done{opacity:.55}
  .ask.onscreen{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
  .ask .body{flex:1 1 auto;min-width:0}
  .ask .t{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
  .ask .m{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
  .ask .acts{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap}
  .spotcard{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
    padding:14px 16px;margin-bottom:16px;border-radius:10px;background:#eef3f7;border-left:4px solid var(--steel)}
  .spotcard .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:700;margin-bottom:4px}
  .spotcard .t{font-size:1.25rem;font-weight:600;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
  .askzone{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
  .askzone textarea{min-height:72px}
  .mine{margin-top:14px}
  #qabadge{display:none;position:fixed;bottom:56px;right:14px;z-index:9;font-size:.85rem}

  /* questions asked only once: go through them on the spot */
  .once-tag,.back-tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:1px;white-space:nowrap}
  .once-tag{color:var(--accent);background:var(--accent-soft)}
  .back-tag{color:var(--muted);background:#efeff2}
  .result.once .qtext{box-shadow:inset 4px 0 0 var(--accent);padding-left:12px}

  /* one-SNP demo: height against genotype, with an effect-size knob */
  .snp-main{display:grid;gap:14px 28px;align-items:center}
  body.present .snp-main{grid-template-columns:minmax(0,max(780px,calc(54vh * 900 / 520))) 440px;justify-content:center}
  body.present .snp-slide{width:fit-content;max-width:100%;margin:0 auto}
  .snp-left{display:grid;gap:10px;min-width:0}
  .snp-left > svg{width:100%;height:auto;max-height:54vh;display:block;overflow:visible}
  table.snp-p{width:100%;border-collapse:collapse;font-size:1.15rem;font-variant-numeric:tabular-nums;table-layout:fixed}
  table.snp-p col.pth{width:7.4em}
  .snp sup{line-height:0}
  table.snp-p th{text-align:left;font-weight:600;color:var(--muted);padding:5px 10px 5px 0;white-space:nowrap}
  table.snp-p td{text-align:right;padding:5px 0 5px 10px;white-space:nowrap}
  table.snp-p tr + tr{border-top:1px solid var(--line)}
  table.snp-p td small{color:var(--muted)}
  table.snp-p tr.pv td{font-weight:700;font-size:1.3rem;color:var(--ink)}
  table.snp-p tr.pv td.sig{color:var(--accent)}
  .snp-pnote{margin:0;font-size:1rem;color:var(--muted)}
  .snp-side{display:grid;gap:12px;align-content:center}
  .snp-box{border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px;background:var(--panel);display:grid;gap:8px;min-width:0}
  .snp-box > *{min-width:0}
  .snp-box h4{margin:0;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .snp-box h4 + .snp-knob{margin-top:0}
  .snp-boxhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .snp-side label{margin:0;font-size:1.6rem;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
  .snp-side input[type=range]{width:100%;accent-color:var(--accent);height:34px;margin:0}
  .snp-side .plot-read small{font-size:1.05rem;font-weight:600;color:var(--muted)}
  .snp-knob{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:4px}
  .snp-side .plot-read{font-size:1.7rem}
  .snp .sdot{fill:var(--accent);fill-opacity:.55}
  .snp .sdot.few{fill-opacity:1;stroke:#fff;stroke-width:2}
  .snp .sax text{font-size:18px;fill:var(--muted)}
  .snp .sax .gl{font-size:26px;fill:var(--ink);font-weight:700}
  .snp .sax line{stroke:var(--line)}
  .snp .sax .lbl{font-size:20px;fill:var(--ink);font-weight:600}
  .snp .smean{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
  .snp .sfit{stroke:var(--steel);stroke-width:3}
  .snp .sfitlbl{font-size:20px;fill:var(--steel);font-weight:600}
  .snp .sfitkey{stroke:var(--steel);stroke-width:3}
  .snp-ss{display:grid;gap:4px;font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .snp-ss div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .snp-ss small{font-size:.9rem;color:var(--muted)}
  .snp-ss b{font-size:1.5rem}
  .snp-r2{display:grid;gap:4px}
  .snp-r2 .lbl{font-size:1.25rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .snp-r2 b{font-size:2.8rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .snp .sres{stroke:var(--steel);stroke-width:1.2;opacity:.45;display:none}
  .snp.resid .sres{display:inline}
  .snp-bar{height:22px;border-radius:11px;background:var(--track);overflow:hidden}
  .snp-bar i{display:block;height:100%;background:var(--accent);border-radius:11px 0 0 11px;min-width:3px}
  .snp-barlbl{display:flex;justify-content:space-between;gap:12px;font-size:1rem;color:var(--muted)}
  .snp-barlbl span:first-child{color:var(--accent);font-weight:700}
  .snp-formula{margin:0;font-size:1.2rem;color:var(--ink);line-height:1.5;font-variant-numeric:tabular-nums}
  .snp-formula > span{display:block;white-space:nowrap}

  /* colocalization: GWAS and eQTL at one locus, with an LD knob */
  .coloc .snp-left > svg{max-height:64vh}
  body.present .coloc .snp-main{grid-template-columns:minmax(0,max(780px,calc(64vh * 900 / 600))) 440px}
  .coloc .cax line{stroke:var(--line)}
  .coloc .cax text{font-size:16px;fill:var(--muted)}
  .coloc .cax .lbl{font-size:18px;fill:var(--ink);font-weight:600}
  .coloc .cax .ptitle{font-size:19px;fill:var(--ink);font-weight:700}
  .coloc .cdot{stroke:#fff;stroke-width:.8}
  .coloc .b0{fill:#cfcfd6} .coloc .b1{fill:#e6b1b1} .coloc .b2{fill:#cf7676} .coloc .b3{fill:#a83c3c} .coloc .b4{fill:#800000}
  .coloc .clead{fill:var(--ink);stroke:#fff;stroke-width:1.5}
  .coloc .clead.e{fill:#fff;stroke:var(--ink);stroke-width:2.5}
  .coloc .ccause{fill:none;stroke:var(--steel);stroke-width:3}
  .coloc .ccauselbl{font-size:16px;font-weight:700;fill:var(--steel)}
  .coloc .cgw{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5}
  .coloc .cgwlbl{font-size:14px;fill:var(--muted)}
  .coloc .gene rect,.coloc .gene path{fill:#b9b9c2}
  .coloc .gene text{font-size:16px;fill:var(--muted);font-weight:600}
  .coloc .gene.gx rect,.coloc .gene.gx path{fill:var(--ink)}
  .coloc .gene.gx text{fill:var(--ink);font-weight:700}
  .ckey{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:1rem;color:var(--muted)}
  .ckey span{display:flex;align-items:center;gap:6px}
  .ckey i{display:inline-block;width:13px;height:13px;border-radius:50%}
  .ckey .b0{background:#cfcfd6} .ckey .b1{background:#e6b1b1} .ckey .b2{background:#cf7676} .ckey .b3{background:#a83c3c} .ckey .b4{background:#800000}
  .coloc .snp-box button{font-size:1rem;padding:8px 13px;justify-self:start}
  .coloc .snp-box button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .coloc .snp-side input[type=range]:disabled{opacity:.35}
  .cpp{display:grid;gap:6px}
  .cpp > div:not(.snp-bar){display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:1.15rem;color:var(--ink)}
  .cpp small{font-size:.85rem;color:var(--muted);font-weight:600;margin-left:4px}
  .cpp b{font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
  .cpp .snp-bar{height:16px;margin-bottom:6px}
  .cpp .snp-bar.h3 i{background:var(--steel)}
  .cpp .rest{font-size:1rem !important;color:var(--muted) !important}
  .cpp .rest b{font-size:1.1rem}
  .cleads{margin:0;font-size:1.1rem;color:var(--ink);line-height:1.45;min-height:3em}

  /* class eQTL scan: one gene per phone, then the class's p-values on screen */
  .gene-plot{width:100%;height:auto;display:block;margin:4px 0 6px}
  .gene-plot .gax line{stroke:var(--line)}
  .gene-plot .gax text{font-size:11px;fill:var(--muted)}
  .gene-plot .gax .gname{font-size:15px;font-weight:700;fill:var(--ink)}
  .gene-plot .gax .glbl{font-size:12px;fill:var(--ink);font-weight:600}
  .gene-plot .gdot{fill:var(--accent);fill-opacity:.5}
  .gene-plot .gbox{fill:none;stroke:var(--ink);stroke-width:1.5}
  .gene-plot .gmed{stroke:var(--ink);stroke-width:3}
  .scan-p{margin:6px 0 0;font-size:1.05rem}
  .scan-p b{color:var(--accent);font-variant-numeric:tabular-nums}
  .scan-p sup,.scan-t sup{line-height:0}
  .scan-truth{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#efeff2;color:var(--ink);font-size:.95rem}
  .scan-truth.real{background:var(--accent-soft)}
  body.present .scan .snp-main{grid-template-columns:minmax(0,max(700px,calc(54vh * 900 / 520))) 500px}
  .scan .snp-side{align-self:start}          /* the buttons stay put when the view changes */
  .scan .hax text{font-size:18px;fill:var(--muted)}
  .scan .hax line{stroke:var(--line)}
  .scan .hax .lbl{font-size:20px;fill:var(--ink);font-weight:600}
  .scan .hyes,.scan .hreal{fill:var(--accent)}
  .scan .hno,.scan .hnull{fill:#c4c4cc}
  .scan .hall{fill:var(--steel)}
  .scan .hcut{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5}
  .scan .hcutlbl{font-size:17px;fill:var(--ink);font-weight:600}
  .hkey{display:flex;gap:22px;font-size:1.1rem;color:var(--ink)}
  .hkey span{display:flex;align-items:center;gap:8px}
  .hkey i{display:inline-block;width:16px;height:16px;border-radius:3px}
  .hkey i.hyes{background:var(--accent)}
  .hkey i.hno{background:#c4c4cc}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .scan .snp-box button{font-size:1rem;padding:8px 13px;justify-self:start}
  .scan .snp-box button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .snp-box h4 small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:.85rem;margin-left:6px}
  table.scan-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed;font-size:1.05rem}
  table.scan-t col.sth{width:42%}
  table.scan-t th{text-align:left;font-weight:700;color:var(--ink);padding:6px 8px 6px 0;line-height:1.2}
  table.scan-t th small{display:block;font-weight:500;color:var(--muted);font-size:.8rem;margin-top:2px}
  table.scan-t td{text-align:right;padding:6px 0 6px 6px;white-space:nowrap}
  table.scan-t tr + tr{border-top:1px solid var(--line)}
  table.scan-t tr.hd td{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  table.scan-t td b{font-size:1.3rem}
  table.scan-t .q{color:var(--muted)}
  .scan-note{margin:0;font-size:1.05rem;color:var(--ink);line-height:1.45}

  /* image steps */
  .fig{margin:0}
  .fig img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:6px;background:#fff}
  body.present .fig img{max-height:calc(100vh - 48px)}
  .qitem .thumb{display:block;width:150px;max-width:100%;margin-top:8px;border:1px solid var(--line);border-radius:4px;background:#fff}

  /* discussion steps */
  .disc-q{margin-bottom:18px}

<body>

<button class="exit-present ghost" onclick="setPresent(false)">Exit present mode</button>
<button id="qabadge"></button>
<div id="joinbadge"><div id="qrmini"></div><div>join at<br><b id="badgecode"></b></div></div>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script src="prs-height.js"></script>
<script type="module">
const app  = document.getElementById("app");
const SDK  = "https://www.gstatic.com/firebasejs/10.12.2/";
const LETTERS = "ABCDEFGHIJKLMNOP";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Present mode also asks the browser for real full screen (no tabs, no address bar). The
// browser handles Esc itself while full screen, and leaving full screen leaves present mode.
let fullByPresent = false;
window.setPresent = on => {
  document.body.classList.toggle("present", !!on);
  document.dispatchEvent(new Event("presentchange"));
  const el = document.documentElement;
  if (on && !document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: "hide" }).then(() => { fullByPresent = true; }).catch(() => {});
  } else if (!on && fullByPresent && document.fullscreenElement && document.exitFullscreen) {
    fullByPresent = false;
    document.exitFullscreen().catch(() => {});
  }
};
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && fullByPresent) {
    fullByPresent = false;
    if (document.body.classList.contains("present")) setPresent(false);
  }
});
function fatal(title, detail){ app.innerHTML = `<h1>${title}</h1><p class="sub">${detail}</p>`; }

/* ---------- guard: config not filled in ---------- */
if (!window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey).includes("PASTE" + "_ME")) {
  app.innerHTML = `
    <h1>Live Poll — one more step</h1>
    <p class="sub">The app is installed, but it needs a (free) Firebase project to store votes.</p>
    <div class="panel setup"><ol>
      <li>Create a project at <code class="inline">console.firebase.google.com</code>.</li>
      <li>Build &rarr; <b>Firestore Database</b> &rarr; Create database (production mode).</li>
      <li>Build &rarr; <b>Authentication</b> &rarr; enable <b>Anonymous</b>.</li>
      <li>Project settings &rarr; Your apps &rarr; Web &rarr; copy <code class="inline">firebaseConfig</code> into the top of this file.</li>
      <li>Paste <code class="inline">firestore.rules</code> into Firestore &rarr; Rules &rarr; Publish.</li>
    </ol></div>`;
  throw new Error("config");
}

/* ---------- firebase, loaded dynamically so a network failure
              shows a message instead of a blank page ---------- */
let initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
    getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs,
    collection, onSnapshot, writeBatch, query, orderBy, where, deleteField;
try {
  ({ initializeApp } = await import(SDK + "firebase-app.js"));
  ({ getAuth, signInAnonymously, onAuthStateChanged } = await import(SDK + "firebase-auth.js"));
  ({ getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs,
     collection, onSnapshot, writeBatch, query, orderBy, where, deleteField } = await import(SDK + "firebase-firestore.js"));
} catch (e) {
  fatal("Can't reach Firebase",
        "The page loaded but couldn't download the Firebase library. Check the network and reload.");
  throw e;
}

const fb   = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(fb);
const db   = getFirestore(fb);

let uid = null;
const ready = new Promise((resolve, reject) => {
  onAuthStateChanged(auth, u => { if (u) { uid = u.uid; resolve(u); } });
  signInAnonymously(auth).catch(reject);
});

/* ---------- data model -------------------------------------------------
   polls/<ROOM>                     { owner, current, open, show[], title, reveal, qa, spot, ticker, createdAt }
   polls/<ROOM>/questions/<QID>     { question, options[], order, standalone, earlier }
   polls/<ROOM>/questions/<QID>/votes/<uid>  { choice }
   polls/<ROOM>/slides/<SID>        { title, qids[], order }
   polls/<ROOM>/asks/<AID>          { text, by, at, status, shown }

   One ROOM per course or lecture — that's what the QR code points at.
   Questions live inside it, and students stay on the same page all hour.

   The lecture steps through "items" in order: a question on its own, or a
   slide that puts several questions on phones at once (new ones, or earlier
   ones brought back to revisit). `current` is the item showing; `show` lists
   the question ids students can answer right now. A question with
   standalone:false is only shown inside slides. `earlier` is the tally saved
   by Re-poll, shown as a "before" bar beside the new votes. Results stay hidden
   on the projector and phones until `reveal` is set: by hand, or automatically
   when voting closes on questions that have been re-polled.

   Students can type questions in while `qa` is on. Each student reads only
   their own; the instructor sees all, and `spot` is the one on the projector.
   Unless `ticker` is false, open ones also stream across the bottom of it; `shown`
   counts the passes, and a question drops off the ticker after PASSES of them.
---------------------------------------------------------------------- */
const roomRef  = r          => doc(db, "polls", r);
const qsRef    = r          => collection(db, "polls", r, "questions");
const qRef     = (r, q)     => doc(db, "polls", r, "questions", q);
const votesRef = (r, q)     => collection(db, "polls", r, "questions", q, "votes");
const voteRef  = (r, q, u)  => doc(db, "polls", r, "questions", q, "votes", u);
const slidesRef = r         => collection(db, "polls", r, "slides");
const sRef     = (r, s)     => doc(db, "polls", r, "slides", s);
const asksRef  = r          => collection(db, "polls", r, "asks");
const askRef   = (r, a)     => doc(db, "polls", r, "asks", a);
const MAX_ASK  = 500;       // characters; keep in step with firestore.rules
const PASSES   = 5;         // times a student question crosses the ticker before it drops off
const MAX_PER_SLIDE = 12;   // keep in step with firestore.rules

function newCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:4}, () => A[Math.floor(Math.random()*A.length)]).join("");
}
const newQid = () => "q" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
const newSid = () => "s" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
const newAid = () => "a" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
const clock  = t => new Date(t || 0).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const baseUrl = () => location.origin + location.pathname;
const joinUrl = r => baseUrl() + "#p/" + r;

function tally(qdata, voteDocs){
  const n = (qdata && qdata.options || []).length;
  const counts = new Array(n).fill(0);
  let total = 0;
  for (const v of voteDocs) {
    const c = v.choice;
    if (Number.isInteger(c) && c >= 0 && c < n) { counts[c]++; total++; }
  }
  return { counts, total };
}

// Results stay hidden until the instructor reveals them (closing voting on a
// re-polled question does it automatically), so nobody is swayed by the room;
// hidden, a question shows only its options and how many have answered.
// Normally the leading option fills the track. Once a re-poll has saved an
// earlier round, each option gets a pale "before" bar over a solid "after" bar,
// both drawn as a share of their own round's responses so they sit on one scale.
const hasEarlier = q => !!(q.earlier && q.earlier.total);
const pctOf = (c, total) => total ? Math.round(c / total * 100) : 0;
function barWidths(qdata, counts, total){
  if (hasEarlier(qdata)) return counts.map(c => total ? c / total * 100 : 0);
  const max = Math.max(1, ...counts);
  return counts.map(c => c / max * 100);
}
function earlierWidths(qdata){
  if (!hasEarlier(qdata)) return null;
  const e = qdata.earlier;
  return (qdata.options || []).map((_, i) => (Number(e.counts && e.counts[i]) || 0) / e.total * 100);
}
function totalText(qdata, total, hidden){
  const n = `${total} response${total === 1 ? "" : "s"}`;
  if (hidden) return `${n} · results hidden for now`;
  return hasEarlier(qdata) ? `before: ${qdata.earlier.total} · after: ${n}` : n;
}
function barNum(qdata, counts, total, i){
  if (!hasEarlier(qdata)) return `<b>${counts[i]}</b> · ${pctOf(counts[i], total)}%`;
  const e = qdata.earlier;
  return `<span class="then">${pctOf(Number(e.counts && e.counts[i]) || 0, e.total)}%</span> &rarr; <b>${pctOf(counts[i], total)}%</b>`;
}

// The most-chosen answer is drawn in the accent colour, the rest in grey.
const leads = counts => { const max = Math.max(0, ...counts); return counts.map(c => max > 0 && c === max); };

function resultsHTML(qdata, counts, total, hidden){
  const w = barWidths(qdata, counts, total), ew = earlierWidths(qdata), lead = leads(counts);
  const bars = (qdata.options || []).map((opt, i) => {
    const label = `<span class="bar-label">
          <span class="tag">${LETTERS[i]}</span>
          <span>${esc(opt)}</span>
        </span>`;
    if (hidden) return `<div class="bar"><div class="bar-top">${label}</div></div>`;
    return `<div class="bar">
      <div class="bar-top">${label}<span class="bar-num">${barNum(qdata, counts, total, i)}</span></div>${
      ew ? `<div class="track then"><div class="fill" style="width:${ew[i].toFixed(1)}%"></div></div>` : ""}
      <div class="track"><div class="fill${lead[i] ? " lead" : ""}" style="width:${w[i].toFixed(1)}%"></div></div>
    </div>`;
  }).join("");
  const key = !hidden && ew ? `<div class="key"><span><i class="then"></i>before</span><span><i></i>after</span></div>` : "";
  const foot = hidden
    ? `<span class="count"><b>${total}</b> answered</span><span class="hush">results hidden</span>`
    : totalText(qdata, total, false);
  return `<div class="qtext">${esc(qdata.question || "Untitled question")}</div>
          <div class="bars">${key}${bars}</div>
          <div class="total">${foot}</div>`;
}

// One block per question; several questions sit in a grid under the slide title.
function slideResultsHTML(title, qs, tallies, hidden){
  const blocks = qs.map((q, k) =>
    `<div class="result" data-q="${esc(q.id)}">${resultsHTML(q, tallies[k].counts, tallies[k].total, hidden)}</div>`).join("");
  return (title ? `<div class="stitle">${esc(title)}</div>` : "") +
    (qs.length > 1 ? `<div class="rgrid n${Math.min(qs.length, 5)}">${blocks}</div>` : blocks);
}

/* ---------- importing a whole set of polls from plain text -------------
   # Slide title       starts a slide; the questions below it go on it
   ---                 ends the slide; questions after it stand on their own
   Q: question text    a question, with its options on "- option" lines
   Q: earlier text     inside a slide and with no options: brings back the
                       question with that exact wording, to revisit it
   // a note           ignored, so a deck can carry an answer key
---------------------------------------------------------------------- */
// An image is a file on this site (slides/figure.png) or an https:// link, nothing else.
const safeSrc = src => typeof src === "string" && src.length < 500 &&
  (/^https:\/\/[^\s"'<>]+$/i.test(src) || /^(?!\/)(?!.*\.\.)[\w\-./]+\.(png|jpe?g|gif|svg|webp)$/i.test(src));
const sameText = (a, b) => a.trim().toLowerCase().replace(/\s+/g, " ") === b.trim().toLowerCase().replace(/\s+/g, " ");
function parseDeck(text, existing){
  const items = [], errors = [], fresh = [];
  let slide = null, q = null, disc = null;
  const short = t => t.length > 50 ? t.slice(0, 48) + "…" : t;
  function finishQ(){
    if (!q) return;
    if (!q.options.length && slide) {
      q.reuse = fresh.find(x => x !== q && !x.reuse && sameText(x.question, q.question))
             || existing.find(x => sameText(x.question, q.question));
      if (!q.reuse) errors.push(`Line ${q.line}: no options, and no earlier question with this exact wording to bring back.`);
    } else if (q.options.length < 2) errors.push(`Line ${q.line}: “${short(q.question)}” needs at least two options.`);
    if (q.options.length > 8) errors.push(`Line ${q.line}: at most 8 options per question.`);
    if (q.question.length >= 500) errors.push(`Line ${q.line}: questions must be under 500 characters.`);
    q = null;
  }
  function finishSlide(){
    if (!slide) return;
    if (!slide.qs.length) errors.push(`Line ${slide.line}: slide “${short(slide.title)}” has no questions.`);
    if (slide.qs.length > MAX_PER_SLIDE) errors.push(`Line ${slide.line}: at most ${MAX_PER_SLIDE} questions per slide.`);
    slide = null;
  }
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(), n = i + 1;
    if (!line || line.startsWith("//")) return;
    let m;
    if ((m = line.match(/^D\s*[:.)]\s*(.+)$/i))) {
      finishQ(); finishSlide();
      disc = { kind: "d", title: m[1].trim().slice(0, 299), points: [], line: n };
      items.push(disc);
      return;
    }
    if (disc && /^[-*•]\s*/.test(line)) { disc.points.push(line.replace(/^[-*•]\s*/, "").slice(0, 300)); return; }
    disc = null;
    if ((m = line.match(/^(SNP|EQTL|SCAN|COLOC)\s*[:.)]\s*(.*)$/i))) {
      finishQ(); finishSlide();
      items.push({ kind: m[1].toLowerCase(), title: m[2].trim().slice(0, 299), line: n });
      return;
    }
    if ((m = line.match(/^IMG\s*[:.)]\s*(\S+)(?:\s+(.+))?$/i))) {
      finishQ(); finishSlide();
      if (!safeSrc(m[1])) errors.push(`Line ${n}: an image must be a file on the site (like slides/figure.png) or an https:// link.`);
      items.push({ kind: "i", src: m[1], title: (m[2] || "").trim().slice(0, 299), line: n });
      return;
    }
    if (line.startsWith("#")) {
      finishQ(); finishSlide();
      slide = { kind: "s", title: line.replace(/^#+\s*/, "").slice(0, 299), qs: [], line: n };
      items.push(slide);
    } else if (/^-{3,}$/.test(line)) {
      finishQ(); finishSlide();
    } else if ((m = line.match(/^Q\s*[:.)]\s*(.+)$/i))) {
      finishQ();
      q = { question: m[1].trim(), options: [], line: n };
      fresh.push(q);
      if (slide) slide.qs.push(q); else items.push({ kind: "q", q });
    } else if ((m = line.match(/^[-*•]\s*(.+)$/))) {
      if (q) q.options.push(m[1].trim());
      else errors.push(`Line ${n}: an option with no question above it.`);
    } else {
      errors.push(`Line ${n}: start questions with “Q:”, discussion prompts with “D:”, images with “IMG:”, the one-SNP demo with “SNP:” (or “EQTL:”), the class eQTL scan with “SCAN:”, the colocalization demo with “COLOC:”, options with “-” and slides with “#”.`);
    }
  });
  finishQ(); finishSlide();
  const newCount = fresh.filter(x => !x.reuse).length;
  const count = k => items.filter(x => x.kind === k).length;
  return { items, errors, newCount, slideCount: count("s"), revisits: fresh.length - newCount,
           discussions: count("d"), images: count("i"), snps: count("snp"), eqtls: count("eqtl"), scans: count("scan"), colocs: count("coloc") };
}

/* ---------- activity: height polygenic score ---------- */
// The data (prs-height.js) holds 18 SNPs and each celebrity's genotypes. Effects are in cm
// per copy of the effect allele, shown to 2 decimal places. The polygenic score is the sum of
// effect × copies, and averages zero across the celebrities; the predicted height is their
// average height (170.5 cm) plus the score. Sums are done in hundredths of a cm, so a careful
// hand calculation matches the answer key exactly.
const PRS = window.PRS_HEIGHT || null;
const prsBeta   = k => Math.round(PRS.snps[k].beta * 100) / 100;
const prsScore  = c => PRS.snps.reduce((sum, _, k) => sum + Math.round(PRS.snps[k].beta * 100) * PRS.people[c].dosage[k], 0) / 100;
const prsMean   = () => Math.round(PRS.people.reduce((t, x) => t + (x.height || 0), 0) / PRS.people.length * 10) / 10;
const prsHeight = c => Math.round((prsMean() + prsScore(c)) * 100) / 100;
// Prediction plot. Each dot is one celebrity: up is their reported height, which never
// moves; across is their height as predicted from a polygenic score. "Our 18 SNPs" puts each
// dot at the height the students worked out (average height + score). The R² knob sets how
// good that score is. In standard units, a score that correlates r = √R² with height is
//   g = r · height + √(1 − r²) · u,      and the best prediction from it is  r · g
// so at R² = 1 every prediction is exactly right (the diagonal) and at R² = 0 everyone is
// predicted the average (a vertical line at the mean). u is each celebrity's own share of
// the score that has nothing to do with their height, taken from the score the class
// computed (rescaled, uncorrelated with height); it stays fixed as the knob turns, so dots
// slide rather than jump. At the class's own R² the knob gives the best prediction from the
// scores they worked out: with all 26 celebrities that's their heights to within 0.05 cm,
// and within about a cm for a class of 15 or more.
function plotModel(ids){
  const x = ids.map(prsHeight), n = ids.length;
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) ** 2))) || 1; };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gauss = () => Math.sqrt(-2 * Math.log(rnd())) * Math.cos(2 * Math.PI * rnd());
  const real = ids.every(c => Number.isFinite(PRS.people[c].height));
  const h = real ? ids.map(c => PRS.people[c].height) : ids.map(() => 170 + 9 * gauss());
  const mh = mean(h), sh = sd(h), zy = h.map(v => (v - mh) / sh);
  const mx = mean(x), zx = x.map(v => (v - mx) / sd(x));
  const r = mean(zx.map((v, i) => v * zy[i]));
  let u = zx.map((v, i) => v - r * zy[i]);
  if (sd(u) < 1e-9) u = zy.map(() => gauss());
  const mu = mean(u), su = sd(u); u = u.map(v => (v - mu) / su);
  return { ids, x, h, zx, zy, u, mh, sh, r, real, n };
}
// Predicted height for celebrity i; r2 === null means the height the class worked out.
function plotPred(m, i, r2){
  if (r2 === null) return m.x[i];
  const r = Math.sqrt(r2), g = r * m.zy[i] + Math.sqrt(1 - r2) * m.u[i];
  return m.mh + m.sh * r * g;
}

// GWAS size → how good a score can be. The usual expectation for a polygenic score
// (Daetwyler et al. 2008):  R² = h² / (1 + M / (N · h²)),  N the number of people in the
// GWAS, h² the share of the variation the SNPs can capture at best (the SNP heritability,
// about 0.6 for height, against a heritability of about 0.8), and M the effective number of
// independent effects to estimate. M is set so that 5.4 million people, the largest height
// GWAS (2022), gives 0.45, the top of the 40–45% it reported in people of European
// ancestry. With one curve shape, the smaller, earlier GWAS then come out somewhat low.
const GWAS_H2 = 0.6, GWAS_M = 1.1e6, GWAS_LO = 3, GWAS_HI = 7;      // knob: 1,000 to 10 million
const gwasR2 = n => GWAS_H2 / (1 + GWAS_M / (n * GWAS_H2));
const gwasN = r2 => r2 <= 0 ? 0 : r2 >= GWAS_H2 ? Infinity : GWAS_M * r2 / (GWAS_H2 * (GWAS_H2 - r2));
function fmtPeople(n){
  const sig = v => String(Number(v.toPrecision(2)));
  if (n < 1e6) return Number(n.toPrecision(2)).toLocaleString("en-US");
  if (n < 1e9) return sig(n / 1e6) + " million";
  return sig(n / 1e9) + " billion";
}
// The GWAS-size reading: how many people it takes to get the score's R².
function gwasRead(r2, n){
  if (r2 === null) return `<small>drag, or pick a size</small>`;
  if (n == null) n = gwasN(r2);
  if (!Number.isFinite(n)) return `out of reach <small>at any size</small>`;
  if (n < 1000) return n > 0 ? `<small>under</small> 1,000` : "—";
  if (n > 8e9) return `<small>more people than are alive</small>`;
  return `${fmtPeople(n)} <small>people</small>`;
}

function gwasHTML(){
  const W = 300, H = 250, L = 30, R = 12, T = 30, B = 54;
  const gx = lg => L + (lg - GWAS_LO) / (GWAS_HI - GWAS_LO) * (W - L - R), gy = v => T + (1 - v) * (H - T - B);
  const curve = Array.from({ length: 81 }, (_, k) => {
    const lg = GWAS_LO + k / 80 * (GWAS_HI - GWAS_LO);
    return (k ? "L" : "M") + gx(lg).toFixed(1) + " " + gy(gwasR2(10 ** lg)).toFixed(1);
  }).join("");
  const xt = ["1k", "10k", "100k", "1M", "10M"];
  return { gx, gy, box: { l: L, r: W - R, t: T, b: H - B }, html: `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="How much of the variation a score explains, against the number of people in the GWAS">
        <g class="gax">
          ${[0, 1].map(v => `<line x1="${L}" x2="${W - R}" y1="${gy(v)}" y2="${gy(v)}"/>`).join("")}
          <text x="${L - 8}" y="${gy(0) + 5}" text-anchor="end">0</text>
          <text x="${L - 8}" y="${gy(1) + 5}" text-anchor="end">1</text>
          <text class="glbl" x="${L - 8}" y="${T - 12}">R²</text>
          ${xt.map((t, k) => `<text x="${gx(GWAS_LO + k)}" y="${H - B + 20}" text-anchor="middle">${t}</text>`).join("")}
          <text class="glbl" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">people in the GWAS</text>
        </g>
        <line class="gref" x1="${L}" x2="${W - R}" y1="${gy(0.8)}" y2="${gy(0.8)}"/>
        <text class="greflbl" x="${L + 6}" y="${gy(0.8) - 6}">heritability of height · 0.8</text>
        <line class="gref" x1="${L}" x2="${W - R}" y1="${gy(GWAS_H2)}" y2="${gy(GWAS_H2)}"/>
        <text class="greflbl" x="${L + 6}" y="${gy(GWAS_H2) - 6}">SNP heritability · ${GWAS_H2}</text>
        <path class="gcurve" d="${curve}"/>
        <line class="gguide" id="gh"/><line class="gguide" id="gv"/>
        <circle class="gdot" id="gdot" r="7"/>
      </svg>` };
}

function plotHTML(m){
  const W = 1000, H = 540, L = 70, R = 24, T = 16, B = 62;
  // Both axes are heights in cm on the same range, so the diagonal is "predicted = actual".
  const lo = Math.floor(Math.min(...m.h, m.mh - 2.5 * m.sh) / 10) * 10 - 5;
  const hi = Math.ceil(Math.max(...m.h, m.mh + 2.5 * m.sh) / 10) * 10 + 5;
  const px = v => L + (v - lo) / (hi - lo) * (W - L - R), py = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const ticks = []; for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) ticks.push(v);
  const g = gwasHTML();
  return { geom: { px, py, box: { l: L, r: W - 4, t: T, b: H - B }, gwas: g },
    html: `
    <div class="stitle">Activity</div>
    <div class="qtext" style="margin-bottom:8px">How well does the score predict height?</div>
    <div class="plot" id="plot">
      <div class="plot-main">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Each celebrity's predicted height against their reported height">
        <defs><clipPath id="plotclip"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath></defs>
        <g class="ax">
          ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${py(v)}" y2="${py(v)}"/><text x="${L - 10}" y="${py(v) + 5}" text-anchor="end">${v}</text>`).join("")}
          ${ticks.map(v => `<text x="${px(v)}" y="${H - B + 24}" text-anchor="middle">${v}</text>`).join("")}
          <text class="lbl" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">Height predicted from the polygenic score (cm)</text>
          <text class="lbl" transform="translate(18 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">Reported height (cm)</text>
        </g>
        <g clip-path="url(#plotclip)">
          <line class="fit" x1="${px(lo)}" y1="${py(lo)}" x2="${px(hi)}" y2="${py(hi)}"/>
          <line class="avg" x1="${px(m.mh)}" y1="${T}" x2="${px(m.mh)}" y2="${H - B}"/>
        </g>
        <text class="fitlbl" x="${px(hi) - 8}" y="${py(hi) + 20}" text-anchor="end">perfect prediction</text>
        <text class="fitlbl" x="${px(m.mh) + 6}" y="${H - B - 8}">class average</text>
        <g class="leads">${m.ids.map((c, i) => `<line class="lead" data-i="${i}"/>`).join("")}</g>
        <g class="dots">${m.ids.map((c, i) => `<circle class="dot" data-i="${i}" r="${DOT_R}"/>`).join("")}</g>
        <g class="names">${m.ids.map((c, i) => `<text class="name" data-i="${i}">${esc(PRS.people[c].name)}</text>`).join("")}</g>
      </svg>
      <div class="gwas">
        <div class="gctl">
          <label for="gwasn">GWAS size</label>
          <input type="range" id="gwasn" min="${GWAS_LO}" max="${GWAS_HI}" step="0.01" value="5">
          <span class="plot-read" id="nread"></span>
          <div class="plot-presets">
            <button class="small ghost" data-n="1e4">10,000</button>
            <button class="small ghost" data-n="1e5">100,000</button>
            <button class="small ghost" data-n="1e6">1 million</button>
            <button class="small ghost" data-n="5.4e6">5.4 million · 2022</button>
          </div>
        </div>
        ${g.html}
      </div>
      </div>
      <div class="plot-ctl">
        <label for="r2">R²</label>
        <input type="range" id="r2" min="0" max="1" step="0.01" value="${(m.r * m.r).toFixed(2)}">
        <span class="plot-read" id="r2read"></span>
      </div>
      <div class="plot-ctl">
        <div class="plot-presets">
          <button class="small ghost" data-r2="real">Our 18 SNPs</button>
          <button class="small ghost" data-r2="0">0</button>
          <button class="small ghost" data-r2="0.4">0.4 · best height scores today</button>
          <button class="small ghost" data-r2="0.8">0.8 · heritability of height</button>
          <button class="small ghost" data-r2="1">1</button>
          <button class="small ghost" id="plotnames">Hide names</button>
        </div>
      </div>
      <p class="plot-note" id="plotnote"></p>
    </div>` };
}

const DOT_R = 7;
// Where everything goes for one setting of the knob. Dots that would overlap are nudged
// apart, by at most about a dot's width, so none hides another. Each name then takes the
// nearest free spot around its dot (right, left, the diagonals, above, below, then further
// out), clear of the other names and dots; a name that had to move away gets a thin line
// back to its dot.
function plotLayout(root, pts, box, withNames){
  const n = pts.length, d = pts.map(p => ({ x: p.x, y: p.y }));
  const min = 2 * DOT_R + 1, cap = DOT_R * 1.3;
  for (let it = 0; it < 60; it++) {
    let moved = false;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let dx = d[j].x - d[i].x, dy = d[j].y - d[i].y, dist = Math.hypot(dx, dy);
      if (dist >= min) continue;
      if (dist < 1e-6) { const a = ((i * 7 + j * 13) % 36) * Math.PI / 18; dx = Math.cos(a); dy = Math.sin(a); dist = 1; }
      const push = (min - Math.min(dist, min)) / 2, ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
      d[i].x -= ux * push; d[i].y -= uy * push; d[j].x += ux * push; d[j].y += uy * push; moved = true;
    }
    for (let i = 0; i < n; i++) {
      const ox = d[i].x - pts[i].x, oy = d[i].y - pts[i].y, o = Math.hypot(ox, oy);
      if (o > cap) { d[i].x = pts[i].x + ox / o * cap; d[i].y = pts[i].y + oy / o * cap; }
    }
    if (!moved) break;
  }
  if (!withNames) return { dots: d, names: null };

  const texts = [...root.querySelectorAll(".name")];
  const size = texts.map(t => { let w = 0; try { w = t.getComputedTextLength(); } catch {} return { w: (w || t.textContent.length * 7.4) + 4, h: 17 }; });
  const over = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const dotBoxes = d.map(p => ({ x: p.x - DOT_R - 1, y: p.y - DOT_R - 1, w: 2 * DOT_R + 2, h: 2 * DOT_R + 2 }));
  // Crowded dots pick first, so they get the spots nearest to them.
  const crowd = d.map((p, i) => d.filter(q => Math.hypot(q.x - p.x, q.y - p.y) < 60).length);
  const order = d.map((_, i) => i).sort((a, b) => crowd[b] - crowd[a] || d[a].x - d[b].x);
  const placed = [], names = new Array(n);
  for (const i of order) {
    const { w, h } = size[i], p = d[i];
    let pick = null;
    for (const r of [10, 18, 30, 46, 66, 92, 125]) {
      const k = r * 0.7, spots = [[r, -h / 2], [-r - w, -h / 2], [k, -k - h], [k, k], [-k - w, -k - h], [-k - w, k], [-w / 2, -r - h], [-w / 2, r]];
      for (const [ox, oy] of spots) {
        const b = { x: p.x + ox, y: p.y + oy, w, h };
        if (b.x < box.l || b.x + b.w > box.r || b.y < box.t - 4 || b.y + b.h > box.b) continue;
        if (placed.some(q => over(b, q)) || dotBoxes.some(q => over(b, q))) continue;
        pick = { ...b, lead: !(r === 10 && ox === r) };
        break;
      }
      if (pick) break;
    }
    if (!pick) pick = { x: p.x + 10, y: p.y - h / 2, w, h, lead: false };   // nowhere free: sit beside the dot
    placed.push(pick);
    names[i] = pick;
  }
  return { dots: d, names };
}

// Draw one frame: dots, names, and the lines from each moved name back to its dot.
function plotDraw(root, st){
  const circles = root.querySelectorAll(".dot"), texts = root.querySelectorAll(".name"), leads = root.querySelectorAll(".lead");
  if (circles.length !== st.dots.length) return false;      // the plot was replaced mid-glide
  st.dots.forEach((p, i) => { circles[i].setAttribute("cx", p.x.toFixed(1)); circles[i].setAttribute("cy", p.y.toFixed(1)); });
  if (!st.names) return;
  st.names.forEach((b, i) => {
    texts[i].setAttribute("x", (b.x + 2).toFixed(1)); texts[i].setAttribute("y", (b.y + b.h / 2).toFixed(1));
    const p = st.dots[i], line = leads[i];
    const nx = Math.max(b.x, Math.min(p.x, b.x + b.w)), ny = Math.max(b.y, Math.min(p.y, b.y + b.h));
    const len = Math.hypot(nx - p.x, ny - p.y);
    if (!b.lead || len < DOT_R + 4) { line.setAttribute("visibility", "hidden"); return; }
    line.setAttribute("visibility", "visible");
    line.setAttribute("x1", (p.x + (nx - p.x) / len * DOT_R).toFixed(1)); line.setAttribute("y1", (p.y + (ny - p.y) / len * DOT_R).toFixed(1));
    line.setAttribute("x2", nx.toFixed(1)); line.setAttribute("y2", ny.toFixed(1));
  });
}

// Glide from what's on screen to the new layout, everything together.
function plotGlide(root, to){
  const from = root.__plotNow;
  cancelAnimationFrame(root.__plotRaf || 0);
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!from || still || !from.names !== !to.names) { root.__plotNow = to; plotDraw(root, to); return; }
  const mix = (a, b, t) => a + (b - a) * t, t0 = performance.now(), ms = 700;
  const step = now => {
    const k = Math.min(1, (now - t0) / ms), t = 1 - Math.pow(1 - k, 3);
    const st = {
      dots: to.dots.map((p, i) => ({ x: mix(from.dots[i].x, p.x, t), y: mix(from.dots[i].y, p.y, t) })),
      names: to.names && to.names.map((b, i) => ({ ...b, x: mix(from.names[i].x, b.x, t), y: mix(from.names[i].y, b.y, t),
                                                   lead: t < 1 ? (b.lead || from.names[i].lead) : b.lead })),
    };
    root.__plotNow = st;
    if (plotDraw(root, st) === false) { root.__plotNow = null; return; }
    if (k < 1) root.__plotRaf = requestAnimationFrame(step);
  };
  root.__plotRaf = requestAnimationFrame(step);
}

// Move every prediction to where R² puts it (null: the class's own scores). Heights stay put.
// n is the GWAS size when that's the knob that was turned (R² then follows from it).
function plotPaint(root, m, geom, r2, n = null){
  const pts = m.ids.map((_, i) => ({ x: geom.px(plotPred(m, i, r2)), y: geom.py(m.h[i]) }));
  root.querySelectorAll(".dot").forEach((c, i) => { c.dataset.tx = pts[i].x.toFixed(2); c.dataset.ty = pts[i].y.toFixed(2); });
  plotGlide(root, plotLayout(root, pts, geom.box, !root.querySelector("#plot").classList.contains("nonames")));
  const shown = r2 === null ? m.r * m.r : r2, pct = Math.round(shown * 100);
  root.querySelector("#r2read").textContent = shown.toFixed(2);
  root.querySelector("#r2").value = shown.toFixed(2);
  const ceil = Math.round(GWAS_H2 * 100);
  root.querySelector("#plotnote").textContent = r2 === null
    ? `The heights you computed (teaching data): the scores explain ${pct}% of the variation in these celebrities' heights.`
    : n !== null ? `A GWAS of ${fmtPeople(n)} people: a score from it explains ${pct}% of the variation in height` + (
        n >= 2e6 ? `. Each extra million people adds less: SNPs top out at about ${ceil}%.`
        : r2 < 0.02 ? ", so its predictions barely move off the class average." : ".")
    : r2 >= 0.995 ? "Every prediction exactly right: all the dots on the diagonal."
    : r2 <= 0.005 ? "The score tells us nothing, so the best guess for everyone is the class average."

  root.querySelectorAll(".plot-presets [data-r2]").forEach(b => b.classList.toggle("on",

// The GWAS panel: its knob and reading, and a dot on the curve where the score sits.
function gwasPaint(root, g, r2, n){
  const need = r2 === null ? null : n !== null ? n : gwasN(r2);
  root.querySelector("#nread").innerHTML = gwasRead(r2, n);
  root.querySelector("#gwasn").classList.toggle("idle", r2 === null);
  if (need !== null) root.querySelector("#gwasn").value =
    Math.min(GWAS_HI, Math.max(GWAS_LO, need > 0 ? Math.log10(need) : GWAS_LO)).toFixed(2);
  const dot = root.querySelector("#gdot"), gh = root.querySelector("#gh"), gv = root.querySelector("#gv");
  const set = (el, a) => Object.entries(a).forEach(([k, v]) => el.setAttribute(k, typeof v === "number" ? v.toFixed(1) : v));
  if (r2 === null) { [dot, gh, gv].forEach(el => set(el, { visibility: "hidden" })); return; }
  const y = g.gy(r2), lg = need > 0 && Number.isFinite(need) ? Math.log10(need) : null;

    const x = g.gx(lg);

    set(gv, { visibility: "visible", x1: x, x2: x, y1: y, y2: g.box.b });

}

// The numbers (sums of squares, R², p-values) are for the exact frequency: what 400 people in
// Hardy–Weinberg proportions give, with genotype variance exactly 2pq. For frequencies that
// are multiples of 0.05, 400 people split into those proportions exactly, so the dots give the

    ns: [50, 100, 200, SNP_N, 1000],

function snpPaint(root, g, beta, p, K){
  const d = snpAt(p, K), ys = d.g.map((_, i) => snpY(d, i, beta, K)), people = snpPeople(K);
  const mean = gg => K.mu + beta * (gg - d.mg);
  const xs = d.g.map((gg, i) => g.gx(gg + people[i].j).toFixed(1));
  // Rare genotypes (four people or fewer) get bigger, solid dots so a lone carrier stands out.
  const cnt = [0, 1, 2].map(k => d.g.filter(v => v === k).length);
  root.querySelectorAll(".sdot").forEach((c, i) => {
    const few = cnt[d.g[i]] <= 4;
    c.setAttribute("cx", xs[i]); c.setAttribute("cy", g.py(ys[i]).toFixed(1));
    c.setAttribute("r", few ? 8 : 4.5); c.classList.toggle("few", few);
  });
  // each person's residual: from their dot to the line at their genotype
  root.querySelectorAll(".sres").forEach((l, i) => {
    l.setAttribute("x1", xs[i]); l.setAttribute("x2", xs[i]);
    l.setAttribute("y1", g.py(ys[i]).toFixed(1)); l.setAttribute("y2", g.py(mean(d.g[i])).toFixed(1));
  });

  root.querySelectorAll(".smean").forEach(l => {
    const gg = +l.dataset.g, y = g.py(mean(gg)).toFixed(1);
    l.setAttribute("x1", g.gx(gg - 0.24).toFixed(1)); l.setAttribute("x2", g.gx(gg + 0.24).toFixed(1));
    l.setAttribute("y1", y); l.setAttribute("y2", y);
    l.setAttribute("visibility", cnt[gg] > 1 ? "visible" : "hidden");   // one person is their own average
  });
  const fit = root.querySelector(".sfit");
  fit.setAttribute("x1", g.gx(-0.45).toFixed(1)); fit.setAttribute("y1", g.py(mean(-0.45)).toFixed(1));
  fit.setAttribute("x2", g.gx(2.45).toFixed(1)); fit.setAttribute("y2", g.py(mean(2.45)).toFixed(1));
  root.querySelector(".sfitlbl").textContent = K.fit(beta);
  const r2 = snpR2(p, beta, K), v = beta * beta * 2 * p * (1 - p) + K.sd * K.sd;
  const f = fmtSmall(r2);
  // Sums of squares for 400 people at this exact frequency: around the line, and around the
  // average (the same as summing over the dots, whenever 400 people split exactly).

  const n0 = x => x.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  root.querySelector("#ssres").textContent = n0(ssRes);
  root.querySelector("#sstot").textContent = n0(ssTot);
  root.querySelector("#sq").textContent = `R² = 1 − ${n0(ssRes)} / ${n0(ssTot)} =`;
  root.querySelectorAll("tr.pv td[data-n]").forEach(td => {
    const n = +td.dataset.n, l = r2 >= 1 ? -Infinity : log10P(Math.sqrt((n - 2) * r2 / (1 - r2)));
    td.innerHTML = fmtP(l);
    td.classList.toggle("sig", l < GW_LOG10);
  });
  root.querySelector("#bread").innerHTML = `${fmtB(beta)} <small>${K.unit}</small>`;
  root.querySelector("#beta").value = posAt(beta, K);
  root.querySelector("#mread").innerHTML = fmtFreq(p);
  root.querySelector("#maf").value = K.ps.indexOf(p);
  root.querySelector("#sr2").innerHTML = f;
  root.querySelector("#sbar").style.width = (r2 * 100).toFixed(2) + "%";
  const cmp = K.compare();
  root.querySelector("#sform").innerHTML = `<span><b>R² = h²<sub>SNP</sub> = 2pq·β² / Var(${K.trait})</b></span>
    <span>= 2 × ${p >= 0.1 ? p.toFixed(2) : p} × ${p >= 0.1 ? (1 - p).toFixed(2) : String(Number((1 - p).toFixed(3)))} × ${fmtB(beta)}² / ${v.toFixed(dec ? K.vdec + 3 : K.vdec)} = ${f}</span>
    <span class="muted">Var(${K.trait}) = Σ (${K.trait} − average)² / ${SNP_N}</span>${cmp ? `
    <span class="muted">${cmp}</span>` : ""}`;
  root.querySelectorAll(".plot-presets [data-b]").forEach(b => b.classList.toggle("on",
    +b.dataset.b === 0 ? beta === 0 : beta > 0 && Math.abs(Math.log10(+b.dataset.b / beta)) < 0.01));
}

// Each phone is one gene: its expression in 100 people, split by their genotype at one SNP near

// p-values, how many eGenes each significance threshold calls, and (T) which genes really had an

// A made-up 600 kb locus with a GWAS signal for a trait and an eQTL for Gene X. Either one variant
// causes both, or two different variants do, with the LD between them on a knob. LD decays with
// genetic distance, r = e^(−d/ℓ), and recombination hotspots break the locus into blocks; each
// study's sampling noise carries the same LD. coloc (Giambartolomei et al. 2014, approximate
// Bayes factors with its default priors) then weighs one shared causal variant (H4) against two
// different ones (H3), from the z-scores alone, as it would with real summary statistics.
const COLOC_TITLE = "Colocalization: one causal variant, or two in LD?";

const COLOC_N1 = 100000, COLOC_N2 = 500;        // study sizes, for coloc's Bayes factors
const COLOC_GENES = [{ name: "Gene Y", a: 95, b: 190, dir: 1 }, { name: "Gene X", a: 300, b: 365, dir: -1, x: true },
                     { name: "Gene Z", a: 430, b: 540, dir: 1 }];
const COLOC = (() => {
  const rnd = rng32(hash32("coloc-locus-1"));
  const gauss = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  const L = 6;                                   // LD decay, in genetic-distance units
  // No hotspot just right of the trait's variant (330 kb), so LD with it fades gradually on that
  // side and the LD knob has every value from 0 to 1 to pick from.

  const pos = []; for (let x = 2 + rnd() * 2; x < 598; x += 0.6 + rnd() * 4.4) pos.push(x);
  const gd = [0];
  for (let i = 1; i < pos.length; i++)

  const n = pos.length, K = (i, j) => Math.exp(-Math.abs(gd[i] - gd[j]) / L);
  // the trait's causal variant: the SNP nearest 330 kb, inside Gene X
  let c1 = 0; pos.forEach((x, i) => { if (Math.abs(x - 330) < Math.abs(pos[c1] - 330)) c1 = i; });
  // Not every SNP follows the local haplotypes closely (think of a rarer allele next to a common
  // one): each SNP gets a tie a to them, so r = a_i·a_j·e^(−d/ℓ), and many neighbours of the lead
  // SNP sit well below it, as in real loci. Still a valid LD matrix: A·K·A + (I − A²).
  const a = pos.map((_, i) => i === c1 ? 1 : rnd() < 0.55 ? 0.97 + 0.03 * rnd() : 0.15 + 0.8 * rnd());
  const r = (i, j) => i === j ? 1 : a[i] * a[j] * K(i, j);

  const noise = () => {
    const e = [gauss()];
    for (let i = 1; i < n; i++) { const p = K(i, i - 1); e.push(p * e[i - 1] + Math.sqrt(1 - p * p) * gauss()); }

  const cands = pos.map((_, j) => j).filter(j => pos[j] > pos[c1] && pos[j] < 560 && a[j] >= 0.97);
  let y2max = 0; for (const j of [c1, ...cands]) for (const v of z2for(j)) y2max = Math.max(y2max, nlp(v));
  return { pos, n, r, a, c1, z1, z2for, lead1, nlp, y1max, y2max, hot, cands };
})();

  const l1 = z1.map(z => 0.5 * Math.log(1 - k1) + 0.5 * k1 * z * z), l2 = z2.map(z => 0.5 * Math.log(1 - k2) + 0.5 * k2 * z * z);
  const s1 = logSumExp(l1), s2 = logSumExp(l2), s12 = logSumExp(l1.map((v, i) => v + l2[i]));
  const p1 = 1e-4, p2 = 1e-4, p12 = 1e-5;
  const both = s1 + s2, h3 = both + Math.log(Math.max(1e-300, 1 - Math.exp(s12 - both)));
  const h = [0, Math.log(p1) + s1, Math.log(p2) + s2, Math.log(p1) + Math.log(p2) + h3, Math.log(p12) + s12];
  const m = logSumExp(h);
  return h.map(v => Math.exp(v - m));
}

function colocPaint(root, g, st){
  const C = COLOC;
  const c2 = st.same ? C.c1 : colocPick(st.ld);
  const z2 = C.z2for(c2), lead2 = z2.reduce((b, v, i) => Math.abs(v) > Math.abs(z2[b]) ? i : b, 0);
  const y1 = i => g.yOf(C.nlp(C.z1[i]), g.p1, g.t1), y2 = i => g.yOf(C.nlp(z2[i]), g.p2, g.t2);
  root.querySelectorAll(".cdot").forEach(c => {
    const i = +c.dataset.i;
    c.setAttribute("cy", (c.dataset.p === "1" ? y1(i) : y2(i)).toFixed(1));
  });
  const at = (el, x, y) => el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  const [d1, d2, de] = root.querySelectorAll(".clead");
  at(d1, g.px(C.pos[C.lead1]), y1(C.lead1));
  at(d2, g.px(C.pos[C.lead1]), y2(C.lead1));
  // the eQTL's own lead, when it isn't the GWAS lead
  de.style.display = lead2 === C.lead1 ? "none" : "";
  at(de, g.px(C.pos[lead2]), y2(lead2));
  const show = !!st.cause;
  const rings = root.querySelectorAll(".ccause"), labels = root.querySelectorAll(".ccauselbl");
  [[C.c1, y1(C.c1), st.same ? "causal for both" : "causal for the trait"], [c2, y2(c2), st.same ? "causal for both" : "causal for expression"]].forEach(([i, y, t], k) => {
    rings[k].setAttribute("cx", g.px(C.pos[i]).toFixed(1)); rings[k].setAttribute("cy", y.toFixed(1));
    rings[k].style.display = show ? "" : "none";
    const left = C.pos[i] > 430, lx = g.px(C.pos[i]) + (left ? -18 : 18);     // near the right edge, label to the left
    labels[k].setAttribute("x", lx.toFixed(1)); labels[k].setAttribute("y", (y - 14).toFixed(1));
    labels[k].setAttribute("text-anchor", left ? "end" : "start");
    labels[k].textContent = t; labels[k].style.display = show ? "" : "none";
  });
  const pp = colocPP(C.z1, z2), pct = v => v >= 0.995 ? "> 99%" : v < 0.005 ? "< 1%" : Math.round(v * 100) + "%";
  root.querySelector("#pp4").textContent = pct(pp[4]); root.querySelector("#pp4bar").style.width = (pp[4] * 100).toFixed(1) + "%";
  root.querySelector("#pp3").textContent = pct(pp[3]); root.querySelector("#pp3bar").style.width = (pp[3] * 100).toFixed(1) + "%";
  root.querySelector("#pp0").textContent = pct(pp[0] + pp[1] + pp[2]);
  const r2c = C.r(c2, C.c1) ** 2, r2l = C.r(lead2, C.lead1) ** 2, kb = Math.abs(C.pos[lead2] - C.pos[C.lead1]);
  root.querySelector("#cldread").innerHTML = st.same ? `<small>same variant</small>` : `r² = ${r2c.toFixed(2)}`;
  root.querySelector("#cld").value = Math.round(st.ld * 100);
  root.querySelector("#cld").disabled = st.same;
  root.querySelectorAll("[data-ld]").forEach(b => { b.disabled = st.same; b.classList.toggle("on", !st.same && Math.abs(+b.dataset.ld - st.ld) < 1e-9); });
  root.querySelectorAll("[data-same]").forEach(b => b.classList.toggle("on", (b.dataset.same === "1") === st.same));
  root.querySelector("#ccausebtn").textContent = show ? "Hide the causal variants" : "Show the causal variants";
  root.querySelector("#ccausebtn").classList.toggle("on", show);
  root.querySelector("#cleads").innerHTML = lead2 === C.lead1
    ? `The GWAS and the eQTL have the <b>same lead SNP</b>.`
    : `GWAS lead ◆ and eQTL lead ◇: <b>${kb < 1 ? "under 1" : Math.round(kb)} kb</b> apart, r² = <b>${r2l.toFixed(2)}</b>.`;
}

// A news ticker for the projector. Each question slides right to left on its
// own track position; once it has fully left on the left it rejoins the back of
// the line, beyond the right edge. New questions join the back the same way, so
// nothing ever pops into view, and a lone question loops with a screen-wide gap.
// onPass(id) fires each time a question finishes crossing the screen.
function makeTicker(view, track, onPass){
  const items = new Map();                     // id -> { el, pos }, in arrival order
  const still = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  let last = 0, raf = 0, running = false;

  const width = el => el.getBoundingClientRect().width;
  const place = it => { it.el.style.transform = `translateX(${it.pos}px)`; };
  const back  = () => {
    let end = view.clientWidth;
    for (const it of items.values()) end = Math.max(end, it.pos + width(it.el));
    return end;
  };
  function frame(t){
    raf = 0;
    const C = view.clientWidth;
    if (!running || !C) { running = false; return; }
    const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    const dx = Math.max(70, C / 16) * dt;          // ~16 s to cross the screen
    for (const it of items.values()) it.pos -= dx;
    for (const [id, it] of items)
      if (it.pos + width(it.el) < 0) { it.pos = back(); if (onPass) onPass(id); }
    items.forEach(place);
    raf = requestAnimationFrame(frame);
  }
  return {
    // list: [{id, text}] in the order they arrived
    set(list){
      const want = new Set(list.map(q => q.id));
      for (const [id, it] of items) if (!want.has(id)) { it.el.remove(); items.delete(id); }
      for (const q of list) {
        if (items.has(q.id)) continue;
        const el = document.createElement("span");
        el.className = "tick";
        el.textContent = q.text;
        track.appendChild(el);
        const it = { el, pos: back() };
        items.set(q.id, it);
        place(it);
      }
    },
    run(on){
      if (on === running) return;
      running = on;
      if (!on) { if (raf) cancelAnimationFrame(raf); raf = 0; return; }
      // Each start lines the questions up just past the right edge, in arrival order
      // (or from the left edge, standing still, for people who prefer less motion).
      let pos = still ? 0 : view.clientWidth;
      for (const it of items.values()) { it.pos = pos; pos += width(it.el); place(it); }
      if (still) { running = false; return; }
      last = 0;
      raf = requestAnimationFrame(frame);
    },
  };
}

// Move the numbers in place so bars animate instead of flashing.
function paintResult(block, qdata, counts, total, hidden){
  if (hidden) {

    }

  }

  block.querySelectorAll(".bar").forEach((bar, i) => {
    const fill = bar.querySelector(".track:not(.then) .fill");
    fill.style.width = w[i].toFixed(1) + "%";
    fill.classList.toggle("lead", lead[i]);
    bar.querySelector(".bar-num").innerHTML = barNum(qdata, counts, total, i);
  });
  block.querySelector(".total").textContent = totalText(qdata, total, false);
}

// The reveal: bars grow from nothing, the "before" round first and then the
// "after" round, and the percentages fade in once the bars have landed.
function growBars(box){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const fills = [...box.querySelectorAll(".fill")];
  if (!fills.length) return;
  const targets = fills.map(f => f.style.width);
  const twoRounds = !!box.querySelector(".track.then");
  fills.forEach(f => { f.style.transition = "none"; f.style.width = "0%"; });
  void box.offsetWidth;
  fills.forEach((f, i) => {
    f.style.transition = "";
    f.style.transitionDelay = twoRounds && !f.parentElement.classList.contains("then") ? ".7s" : "0s";
    f.style.width = targets[i];
  });
  box.classList.add("revealing");
  setTimeout(() => { box.classList.remove("revealing"); fills.forEach(f => { f.style.transitionDelay = ""; }); }, 2000);
}
